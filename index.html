<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EndlessBet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#08080f; color:#fff; user-select:none;
  }

  #space {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(80,40,140,0.25), transparent),
      radial-gradient(ellipse 50% 50% at 85% 80%, rgba(30,60,120,0.2), transparent),
      #08080f;
  }
  .star {
    position:absolute; background:#fff; border-radius:50%;
    animation:twinkle 4s infinite ease-in-out;
  }
  @keyframes twinkle { 0%,100%{opacity:.15} 50%{opacity:.9} }

  .screen {
    position:fixed; inset:0; display:flex; flex-direction:column;
    z-index:1; transition:opacity .25s; background:transparent;
  }
  .screen.hidden { opacity:0; pointer-events:none; }

  .ico {
    display:inline-block; width:1em; height:1em; vertical-align:-0.12em;
    flex-shrink:0; line-height:1;
  }
  .ico svg { width:100%; height:100%; display:block; }

  /* Меню */
  #menu { align-items:center; justify-content:center; padding:28px; text-align:center; }
  .brand {
    font-size:11px; color:#5a5a8a; letter-spacing:5px; text-transform:uppercase;
    margin-bottom:44px;
  }
  .balance-block { margin-bottom:56px; }
  .balance-label { font-size:10px; color:#4a4a7a; letter-spacing:3px; text-transform:uppercase; margin-bottom:12px; }
  .balance-value {
    font-size:54px; font-weight:200; letter-spacing:-1px;
    color:#fff; font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .balance-value .ico { font-size:40px; color:#fff; opacity:.9; }

  .modes { display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px; }
  .mode-btn {
    border:1.5px solid #22224a; background:rgba(20,20,40,0.35);
    backdrop-filter:blur(8px); border-radius:14px;
    padding:20px 24px; color:#fff; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    transition:border-color .2s, background .2s; font-family:inherit;
    font-size:15px; letter-spacing:1px;
  }
  .mode-btn:active { background:rgba(40,40,80,0.4); border-color:#3a3a6a; }
  .mode-btn .label { font-weight:500; }
  .mode-btn .sub { color:#4a4a7a; font-size:11px; margin-top:3px; letter-spacing:0; }

  .menu-footer { margin-top:36px; display:flex; gap:10px; }
  .mini-btn {
    background:transparent; border:1.5px solid #1a1a35; color:#4a4a7a;
    font-size:12px; letter-spacing:1px; cursor:pointer;
    font-family:inherit; padding:10px 18px; border-radius:10px;
    transition:all .2s;
  }
  .mini-btn:active { border-color:#3a3a6a; color:#8a8aba; }

  /* Топбар */
  .topbar {
    padding:18px 22px; display:flex; justify-content:space-between; align-items:center;
  }
  .close-btn {
    background:transparent; border:none; color:#5a5a8a;
    cursor:pointer; padding:6px 10px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:color .2s;
  }
  .close-btn:active { color:#aaaacc; }
  .close-btn .ico { font-size:20px; }
  .topbar-balance {
    color:#8a8aba; font-size:14px; font-variant-numeric:tabular-nums;
    display:flex; align-items:center; gap:6px;
  }
  .topbar-balance .ico { font-size:14px; color:#8a8aba; }

  /* КРАШ */
  .crash-stage {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; position:relative;
  }
  .crash-x {
    font-size:112px; font-weight:100; letter-spacing:-4px;
    color:#fff; font-variant-numeric:tabular-nums;
    line-height:1;
    transition:color .15s ease, opacity .5s ease, transform .5s cubic-bezier(0.4,0,0.2,1);
  }
  .crash-x.crashed {
    color:#ff4d4d;
    animation:crashShake .5s ease-out;
  }
  @keyframes crashShake {
    0%,100% { transform:translateX(0); }
    20% { transform:translateX(-8px); }
    40% { transform:translateX(8px); }
    60% { transform:translateX(-5px); }
    80% { transform:translateX(5px); }
  }
  .crash-x.hidden {
    opacity:0;
    transform:translateY(-30px) scale(0.9);
    pointer-events:none;
  }
  .crash-label {
    position:absolute;
    font-size:80px; font-weight:200; letter-spacing:8px;
    color:#ff4d4d;
    opacity:0;
    transform:translateY(40px) scale(0.85);
    transition:opacity .5s ease .15s, transform .5s cubic-bezier(0.34,1.56,0.64,1) .15s;
    text-shadow:0 0 40px rgba(255,77,77,0.5);
  }
  .crash-label.show { opacity:1; transform:translateY(0) scale(1); }

  .crash-caption {
    margin-top:20px; font-size:11px; color:#4a4a7a; letter-spacing:2px;
    text-transform:uppercase; transition:opacity .3s;
  }
  .crash-caption.hidden { opacity:0; }

  .crash-controls { padding:0 22px 30px; }
  .crash-info {
    text-align:center; font-size:13px; color:#5a5a8a;
    margin-bottom:14px; height:20px; letter-spacing:.5px;
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .crash-info.active { color:#5cd65c; }
  .crash-info .ico { font-size:13px; }

  .bet-row {
    display:flex; align-items:center;
    border:1.5px solid #22224a; background:rgba(20,20,40,0.35);
    border-radius:14px; padding:0 18px; margin-bottom:10px;
    transition:border-color .2s;
  }
  .bet-row:focus-within { border-color:#4a4a7a; }
  #betInput {
    flex:1; background:none; border:none; color:#fff;
    font-size:20px; font-weight:400; padding:18px 0; outline:none;
    width:100%; font-family:inherit; font-variant-numeric:tabular-nums;
  }
  #betInput::placeholder { color:#3a3a5a; }
  .bet-row .unit {
    color:#5a5a8a; font-size:14px;
    display:flex; align-items:center; gap:5px;
  }
  .bet-row .unit .ico { font-size:16px; color:#8a8aba; }

  .quick-row { display:flex; gap:6px; margin-bottom:10px; }
  .quick-btn {
    flex:1; background:rgba(20,20,40,0.35); border:1.5px solid #1a1a35;
    color:#6a6a9a; padding:10px; border-radius:10px; font-size:12px;
    cursor:pointer; transition:all .15s; font-family:inherit;
    font-variant-numeric:tabular-nums;
  }
  .quick-btn:active { border-color:#3a3a6a; color:#aaaacc; }

  .main-btn {
    width:100%; background:rgba(30,30,60,0.4); border:1.5px solid #2a2a4a;
    border-radius:14px; padding:20px; color:#fff;
    font-size:14px; font-weight:500; letter-spacing:3px;
    cursor:pointer; transition:all .2s; font-family:inherit;
    text-transform:uppercase; backdrop-filter:blur(8px);
  }
  .main-btn:active { background:rgba(50,50,100,0.5); border-color:#4a4a7a; }
  .main-btn.cashout { color:#5cd65c; border-color:#2a4a2a; }
  .main-btn:disabled { color:#2a2a4a; border-color:#151530; cursor:not-allowed; }

  /* Кейсы */
  .cases-list {
    flex:1; padding:0 22px; display:flex; flex-direction:column;
    justify-content:center; gap:10px;
  }
  .case-item {
    border:1.5px solid #22224a; background:rgba(20,20,40,0.35);
    backdrop-filter:blur(8px); border-radius:14px;
    padding:20px 24px; color:#fff; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    transition:border-color .2s; font-family:inherit; text-align:left;
  }
  .case-item:active { border-color:#3a3a6a; }
  .case-item .info .name { font-size:15px; letter-spacing:1px; font-weight:500; }
  .case-item .info .range {
    color:#5a5a8a; font-size:11px; margin-top:4px;
    display:flex; align-items:center; gap:3px;
  }
  .case-item .info .range .ico { font-size:10px; }
  .case-item .price {
    font-size:15px; color:#8a8aba; font-variant-numeric:tabular-nums;
    letter-spacing:1px; display:flex; align-items:center; gap:5px;
  }
  .case-item .price .ico { font-size:14px; color:#8a8aba; }

  /* Рулетка */
  .roulette-stage {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .roulette { position:relative; width:100%; height:110px; overflow:hidden; }
  .roulette::before, .roulette::after {
    content:""; position:absolute; top:0; bottom:0; width:80px; z-index:4;
    pointer-events:none;
  }
  .roulette::before { left:0; background:linear-gradient(to right, #08080f 10%, transparent); }
  .roulette::after { right:0; background:linear-gradient(to left, #08080f 10%, transparent); }

  .track {
    position:absolute; top:0; left:0; height:100%;
    display:flex; align-items:center; will-change:transform;
  }
  .slot {
    width:80px; height:90px; margin:0 5px; flex-shrink:0;
    border:1.5px solid #1a1a35; border-radius:12px;
    display:flex; align-items:center; justify-content:center; gap:4px;
    font-size:16px; font-weight:400; color:#6a6a9a;
    font-variant-numeric:tabular-nums;
    transition:border-color .3s, color .3s;
    background:rgba(15,15,30,0.5);
  }
  .slot .ico { font-size:12px; }
  .slot.rare    { color:#8a8aba; border-color:#2a2a4a; }
  .slot.epic    { color:#bbb; border-color:#3a3a5a; }
  .slot.legend  { color:#fff; border-color:#5a5a8a; box-shadow:0 0 12px rgba(90,90,140,0.3); }

  .pointer {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:2px; height:120px; background:#fff; z-index:5;
    border-radius:1px;
    box-shadow:0 0 12px rgba(255,255,255,0.5);
  }
  .spin-result {
    text-align:center; margin-top:36px;
    opacity:0; transition:opacity .3s;
  }
  .spin-result.show { opacity:1; }
  .spin-result .label {
    font-size:10px; color:#5a5a8a; letter-spacing:3px; text-transform:uppercase;
    margin-bottom:8px;
  }
  .spin-result .val {
    font-size:44px; font-weight:200; letter-spacing:-1px;
    color:#fff; font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .spin-result .val .ico { font-size:26px; color:#fff; opacity:.9; }

  .spin-controls { padding:0 22px 30px; }

  /* Профиль */
  .profile-content { flex:1; padding:0 22px; overflow-y:auto; }
  .profile-card {
    border:1.5px solid #22224a; background:rgba(20,20,40,0.35);
    backdrop-filter:blur(8px); border-radius:18px;
    padding:24px; margin-bottom:16px;
    display:flex; align-items:center; gap:16px;
  }
  .profile-avatar {
    width:60px; height:60px; border-radius:50%;
    border:1.5px solid #2a2a4a; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:#8a8aba; background:rgba(30,30,60,0.5);
    overflow:hidden;
  }
  .profile-avatar img { width:100%; height:100%; object-fit:cover; }
  .profile-avatar .ico { font-size:30px; }
  .profile-info .name { font-size:18px; font-weight:500; }
  .profile-info .username { color:#5a5a8a; font-size:13px; margin-top:3px; }

  .stats-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;
  }
  .stat-card {
    border:1.5px solid #1a1a35; background:rgba(15,15,30,0.5);
    border-radius:14px; padding:18px; text-align:center;
  }
  .stat-card .stat-label {
    font-size:10px; color:#4a4a7a; letter-spacing:2px; text-transform:uppercase;
    margin-bottom:8px;
  }
  .stat-card .stat-value {
    font-size:22px; font-weight:300; color:#fff;
    font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .stat-card .stat-value .ico { font-size:16px; }

  .section-title {
    font-size:10px; color:#4a4a7a; letter-spacing:3px; text-transform:uppercase;
    margin:20px 0 10px;
  }

  .promo-row { display:flex; gap:8px; }
  .promo-input {
    flex:1; background:rgba(15,15,30,0.5); border:1.5px solid #1a1a35;
    border-radius:12px; padding:16px 18px; color:#fff;
    font-size:14px; outline:none; font-family:inherit;
    letter-spacing:1px;
  }
  .promo-input::placeholder { color:#3a3a5a; }
  .promo-input:focus { border-color:#3a3a6a; }
  .promo-btn {
    background:rgba(30,30,60,0.5); border:1.5px solid #2a2a4a;
    border-radius:12px; padding:0 20px; color:#8a8aba;
    font-size:13px; cursor:pointer; font-family:inherit;
    letter-spacing:1px; transition:all .2s;
  }
  .promo-btn:active { background:rgba(50,50,100,0.5); border-color:#4a4a7a; }

  .pay-row { display:flex; gap:10px; margin-bottom:10px; }
  .pay-btn {
    flex:1; background:rgba(20,20,40,0.35); border:1.5px solid #22224a;
    border-radius:14px; padding:18px; color:#fff;
    cursor:pointer; font-family:inherit; font-size:13px;
    letter-spacing:1px; transition:all .2s;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .pay-btn:active { border-color:#3a3a6a; background:rgba(40,40,80,0.4); }
  .pay-btn .pay-icon { display:flex; align-items:center; justify-content:center; color:#8a8aba; }
  .pay-btn .pay-icon .ico { font-size:28px; }
  .pay-btn .pay-label { font-weight:500; }
  .pay-btn .pay-sub { font-size:10px; color:#5a5a8a; }

  #toast {
    position:fixed; top:60px; left:50%;
    transform:translateX(-50%) translateY(-40px);
    background:rgba(30,30,60,0.95); color:#ccc;
    padding:12px 22px; border-radius:100px;
    font-size:13px; z-index:100;
    border:1px solid #2a2a4a;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s;
    pointer-events:none; white-space:nowrap; opacity:0;
    letter-spacing:.5px; backdrop-filter:blur(10px);
    display:flex; align-items:center; gap:6px;
  }
  #toast .ico { font-size:12px; }
  #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>

<div id="space"></div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div class="screen" id="menu">
  <div class="brand">Endless</div>

  <div class="balance-block">
    <div class="balance-label">Баланс</div>
    <div class="balance-value" id="menuBalance"></div>
  </div>

  <div class="modes">
    <button class="mode-btn" onclick="openMode('crash')">
      <div>
        <div class="label">Краш</div>
        <div class="sub">Успей забрать</div>
      </div>
    </button>
    <button class="mode-btn" onclick="openMode('cases')">
      <div>
        <div class="label">Кейсы</div>
        <div class="sub">Испытай удачу</div>
      </div>
    </button>
  </div>

  <div class="menu-footer">
    <button class="mini-btn" onclick="openProfile()">профиль</button>
  </div>
</div>

<!-- КРАШ -->
<div class="screen hidden" id="crash">
  <div class="topbar">
    <button class="close-btn" onclick="backToMenu()">
      <span class="ico" data-icon="close"></span>
    </button>
    <div class="topbar-balance" id="crashBalance"></div>
  </div>

  <div class="crash-stage">
    <div class="crash-x" id="multiplier">1.00x</div>
    <div class="crash-label" id="crashLabel">КРАШ</div>
    <div class="crash-caption" id="crashCaption">нажми старт</div>
  </div>

  <div class="crash-controls">
    <div class="crash-info" id="crashInfo"></div>
    <div class="bet-row">
      <input type="number" id="betInput" placeholder="0" value="50" min="1">
      <span class="unit"></span>
    </div>
    <div class="quick-row" id="quickRow">
      <button class="quick-btn" onclick="setBet(10)">10</button>
      <button class="quick-btn" onclick="setBet(50)">50</button>
      <button class="quick-btn" onclick="setBet(100)">100</button>
      <button class="quick-btn" onclick="setBet(500)">500</button>
      <button class="quick-btn" onclick="setBet('all')">max</button>
    </div>
    <button class="main-btn" id="actionBtn" onclick="handleCrashAction()">Старт</button>
  </div>
</div>

<!-- ВЫБОР КЕЙСА -->
<div class="screen hidden" id="cases">
  <div class="topbar">
    <button class="close-btn" onclick="backToMenu()">
      <span class="ico" data-icon="close"></span>
    </button>
    <div class="topbar-balance" id="casesBalance"></div>
  </div>

  <div class="cases-list">
    <button class="case-item" onclick="buyCase('case10')">
      <div class="info">
        <div class="name">Обычный</div>
        <div class="range">1 <span class="ico" data-icon="star"></span> — 1 000 <span class="ico" data-icon="star"></span></div>
      </div>
      <div class="price">10 <span class="ico" data-icon="star"></span></div>
    </button>

    <button class="case-item" onclick="buyCase('case50')">
      <div class="info">
        <div class="name">Редкий</div>
        <div class="range">5 <span class="ico" data-icon="star"></span> — 2 000 <span class="ico" data-icon="star"></span></div>
      </div>
      <div class="price">50 <span class="ico" data-icon="star"></span></div>
    </button>

    <button class="case-item" onclick="buyCase('case100')">
      <div class="info">
        <div class="name">Легендарный</div>
        <div class="range">10 <span class="ico" data-icon="star"></span> — 5 000 <span class="ico" data-icon="star"></span></div>
      </div>
      <div class="price">100 <span class="ico" data-icon="star"></span></div>
    </button>
  </div>
</div>

<!-- ОТКРЫТИЕ -->
<div class="screen hidden" id="caseOpen">
  <div class="topbar">
    <button class="close-btn" onclick="closeCase()">
      <span class="ico" data-icon="close"></span>
    </button>
    <div class="topbar-balance" id="openBalance"></div>
  </div>

  <div class="roulette-stage">
    <div class="roulette">
      <div class="track" id="track"></div>
      <div class="pointer"></div>
    </div>

    <div class="spin-result" id="spinResult">
      <div class="label">Выпало</div>
      <div class="val" id="spinValue"></div>
    </div>
  </div>

  <div class="spin-controls">
    <button class="main-btn" id="spinBtn" onclick="spin()">Открыть</button>
  </div>
</div>

<!-- ПРОФИЛЬ -->
<div class="screen hidden" id="profile">
  <div class="topbar">
    <button class="close-btn" onclick="backToMenu()">
      <span class="ico" data-icon="close"></span>
    </button>
    <div class="topbar-balance" id="profileBalance"></div>
  </div>

  <div class="profile-content">
    <div class="profile-card">
      <div class="profile-avatar" id="avatar"></div>
      <div class="profile-info">
        <div class="name" id="userName">Гость</div>
        <div class="username" id="userUsername">@username</div>
      </div>
    </div>

    <div class="section-title">Баланс</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Обычные</div>
        <div class="stat-value" id="statBalance"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">К выводу</div>
        <div class="stat-value" id="statWithdrawable"></div>
      </div>
    </div>

    <div class="section-title">Статистика</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Всего ставок</div>
        <div class="stat-value" id="statBets">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Побед</div>
        <div class="stat-value" id="statWins">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Макс. краш</div>
        <div class="stat-value" id="statMaxCrash">0x</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Профит</div>
        <div class="stat-value" id="statProfit"></div>
      </div>
    </div>

    <div class="section-title">Промокод</div>
    <div class="promo-row">
      <input type="text" class="promo-input" id="promoInput" placeholder="ВВЕДИ КОД" maxlength="16">
      <button class="promo-btn" onclick="applyPromo()">ОК</button>
    </div>

    <div class="section-title">Вывод</div>
    <div class="pay-row">
      <button class="pay-btn" onclick="withdrawOpen()">
        <span class="pay-icon"><span class="ico" data-icon="star"></span></span>
        <span class="pay-label">Вывод</span>
        <span class="pay-sub">от 100 ★</span>
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ==================== TELEGRAM ==================== */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ==================== API ==================== */
const API_URL = 'https://endlessbet.i-makarov2012.workers.dev';

async function apiCall(path, body) {
  const r = await fetch(API_URL + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'API error');
  return data;
}

/* ==================== ЗВУК ==================== */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function initAudio() { if (!actx) actx = new AudioCtx(); if (actx.state === 'suspended') actx.resume(); }
function tone(freq, dur, type='sine', vol=0.05) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}

function haptic(type) {
  if (!tg?.HapticFeedback) return;
  if (type === 'light')   tg.HapticFeedback.impactOccurred('light');
  if (type === 'medium')  tg.HapticFeedback.impactOccurred('medium');
  if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
  if (type === 'error')   tg.HapticFeedback.notificationOccurred('error');
}

/* ==================== UI ==================== */
function fmt(n) { return Math.floor(n).toLocaleString('ru-RU'); }
function starIco() { return `<span class="ico" data-icon="star">${ICONS.star}</span>`; }

function updateBalance() {
  $('menuBalance').innerHTML = `<span class="num">${fmt(state.balance)}</span>${starIco()}`;
  const h = starIco() + '<span class="num">' + fmt(state.balance) + '</span>';
  $('crashBalance').innerHTML = h;
  $('casesBalance').innerHTML = h;
  $('openBalance').innerHTML = h;
  $('profileBalance').innerHTML = h;
}

function updateStatsUI() {
  $('statBets').textContent = fmt(state.stats.totalBets);
  $('statWins').textContent = fmt(state.stats.wins);
  $('statMaxCrash').textContent = state.stats.maxCrash.toFixed(2) + 'x';
  $('statProfit').innerHTML = (state.stats.profit >= 0 ? '+' : '') + fmt(state.stats.profit) + starIco();
  $('statProfit').style.color = state.stats.profit >= 0 ? '#5cd65c' : '#ff4d4d';
  $('statBalance').innerHTML = fmt(state.balance) + starIco();
  $('statWithdrawable').innerHTML = fmt(state.withdrawable) + starIco();
}

function toastDelta(amount) {
  const t = $('toast');
  const sign = amount >= 0 ? '+' : '';
  t.innerHTML = `<span>${sign}${fmt(amount)}</span>${starIco()}`;
  t.className = 'show';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = '', 1800);
}
function toastText(msg) {
  const t = $('toast');
  t.innerHTML = `<span>${msg}</span>`;
  t.className = 'show';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = '', 1800);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  $(id).classList.remove('hidden');
}

/* ==================== API-ОБЁРТКИ ==================== */
async function syncBalance() {
  const uid = getUserId();
  if (!uid) return;
  try {
    const d = await apiCall('/api/balance', { user_id: uid });
    state.balance = d.balance || 0;
    state.withdrawable = d.withdrawable || 0;
    updateBalance(); updateStatsUI();
  } catch (e) { console.warn('syncBalance:', e); }
}

async function spendAPI(amount) {
  const uid = getUserId();
  if (!uid) { toastText('Открой из Telegram'); return false; }
  try {
    const d = await apiCall('/api/balance/change', { user_id: uid, amount: -amount });
    state.balance = d.balance;
    state.withdrawable = d.withdrawable;
    updateBalance(); updateStatsUI();
    return true;
  } catch (e) { toastText(e.message); return false; }
}

async function winAPI(amount) {
  const uid = getUserId();
  if (!uid) return;
  try {
    const d = await apiCall('/api/balance/win', { user_id: uid, amount });
    state.balance = d.balance;
    state.withdrawable = d.withdrawable;
    updateBalance(); updateStatsUI();
  } catch (e) { console.warn(e); }
}

  initAudio(); haptic('light');
  if (mode === 'crash') {
    showScreen('crash');
    $('betInput').value = Math.min(50, Math.max(1, Math.floor(state.balance)));
  } else {

function backToMenu() {

  if (state.crashPhase === 'flying') cashoutCrash();
  cancelAnimationFrame(state.crashRaf);
  state.crashPhase = 'idle';
  showScreen('menu');
  updateBalance(); updateStatsUI();
}
function closeCase() {
  haptic('light');
  if (state.spinning) return;
  showScreen('cases');
  updateBalance();
}
function openProfile() {
  initAudio(); haptic('light');
  const user = tg?.initDataUnsafe?.user;
  const av = $('avatar');
  if (user) {
    $('userName').textContent = [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Без имени';

/* ==================== КРАШ ==================== */
function generateCrashPoint() {
  const r = Math.random();
  if (r < 0.03) return 1.0 + Math.random() * 0.2;
  const raw = 0.92 / (1 - r);
  return Math.max(1.01, Math.floor(raw * 100) / 100);
}

async function startCrashRound() {
  const bet = Math.floor(Number($('betInput').value) || 0);
  if (bet <= 0) return toastText('Введи ставку');
  if (bet > state.balance) return toastText('Недостаточно звёзд');

  const ok = await spendAPI(bet);
  if (!ok) return;

  toastDelta(-bet);
  state.stats.totalBets++;
  state.crashBet = bet;
  state.crashPhase = 'flying';
  state.crashMultiplier = 1.0;
  state.crashAt = generateCrashPoint();
  state.crashStart = performance.now();

  $('quickRow').style.display = 'none';
  $('betInput').parentElement.style.display = 'none';
  $('actionBtn').textContent = 'Забрать';
  $('actionBtn').className = 'main-btn cashout';
  $('actionBtn').disabled = false;
  $('crashCaption').textContent = `ставка ${fmt(bet)}`;
  $('crashCaption').classList.remove('hidden');
  $('crashLabel').classList.remove('show');

  const el = $('multiplier');
  el.classList.remove('hidden', 'crashed');
  el.style.color = '#fff';
  el.textContent = '1.00x';

  initAudio(); tone(220, 0.08, 'sine');
  haptic('medium');
  state.crashRaf = requestAnimationFrame(crashLoop);
}

function crashLoop(now) {
  if (state.crashPhase !== 'flying') return;
  const elapsed = (now - state.crashStart) / 1000;
  const m = Math.pow(1.0718, elapsed * 1.6);
  state.crashMultiplier = m;

  if (m >= state.crashAt) {
    state.crashMultiplier = state.crashAt;
    return crashBoom();
  }

  const el = $('multiplier');
  el.textContent = m.toFixed(2) + 'x';
  el.style.color = '#fff';

  const potential = Math.floor(state.crashBet * m);
  $('crashInfo').innerHTML = fmt(potential) + ' ' + starIco();
  $('crashInfo').className = 'crash-info active';

  state.crashRaf = requestAnimationFrame(crashLoop);
}

function crashBoom() {
  state.crashPhase = 'crashed';
  cancelAnimationFrame(state.crashRaf);
  tone(200, 0.5, 'sawtooth', 0.1);
  haptic('error');

  if (state.crashAt > state.stats.maxCrash) state.stats.maxCrash = state.crashAt;

  const el = $('multiplier');
  el.className = 'crash-x crashed';
  el.textContent = state.crashAt.toFixed(2) + 'x';

  $('crashCaption').classList.add('hidden');
  $('crashInfo').innerHTML = '';
  $('crashInfo').className = 'crash-info';

  setTimeout(() => {
    el.classList.add('hidden');
    $('crashLabel').classList.add('show');
  }, 900);

  setTimeout(() => endCrashRound(), 2400);
}

async function cashoutCrash() {
  if (state.crashPhase !== 'flying') return;
  state.crashPhase = 'cashed';
  cancelAnimationFrame(state.crashRaf);
  tone(660, 0.1); setTimeout(()=>tone(880, 0.15), 80);
  haptic('success');

  const win = Math.floor(state.crashBet * state.crashMultiplier);
  const profit = win - state.crashBet;

  await winAPI(win);
  state.stats.wins++;
  state.stats.profit += profit;
  updateStatsUI();

  $('multiplier').style.color = '#5cd65c';
  $('crashCaption').textContent = `забрано · +${fmt(win)}`;
  $('crashCaption').classList.remove('hidden');
  $('crashInfo').innerHTML = '';
  $('crashInfo').className = 'crash-info';
  toastDelta(win);

  setTimeout(() => endCrashRound(), 1200);
}

function endCrashRound() {
  state.crashPhase = 'idle';
  const el = $('multiplier');
  el.textContent = '1.00x';
  el.className = 'crash-x';
  el.style.color = '#fff';
  $('crashLabel').classList.remove('show');
  $('crashCaption').textContent = 'нажми старт';
  $('crashCaption').classList.remove('hidden');
  $('quickRow').style.display = 'flex';
  $('betInput').parentElement.style.display = 'flex';
  $('actionBtn').textContent = 'Старт';
  $('actionBtn').className = 'main-btn';
  $('crashInfo').innerHTML = '';
  $('crashInfo').className = 'crash-info';
}

function handleCrashAction() {
  initAudio();
  if (state.crashPhase === 'flying') cashoutCrash();
  else if (state.crashPhase === 'idle') startCrashRound();
}
function setBet(v) {
  haptic('light');
  if (v === 'all') $('betInput').value = Math.max(1, Math.floor(state.balance));
  else $('betInput').value = v;
}

/* ==================== КЕЙСЫ ==================== */
const CASES = {
  case10: {
    price: 10, min: 1, max: 1000,
    prizes: [
      { prize: 1, weight: 3500 }, { prize: 2, weight: 2500 },
      { prize: 5, weight: 1500 }, { prize: 10, weight: 1000 },
      { prize: 25, weight: 700 }, { prize: 50, weight: 500 },
      { prize: 100, weight: 200 }, { prize: 250, weight: 70 },
      { prize: 500, weight: 25 }, { prize: 1000, weight: 5 },
    ]
  },
  case50: {
    price: 50, min: 5, max: 2000,
    prizes: [
      { prize: 5, weight: 3500 }, { prize: 15, weight: 2500 },
      { prize: 30, weight: 1500 }, { prize: 60, weight: 1000 },
      { prize: 100, weight: 700 }, { prize: 200, weight: 500 },
      { prize: 400, weight: 200 }, { prize: 700, weight: 70 },
      { prize: 1200, weight: 25 }, { prize: 2000, weight: 5 },
    ]
  },
  case100: {
    price: 100, min: 10, max: 5000,
    prizes: [
      { prize: 10, weight: 3500 }, { prize: 30, weight: 2500 },
      { prize: 70, weight: 1500 }, { prize: 150, weight: 1000 },
      { prize: 300, weight: 700 }, { prize: 600, weight: 500 },
      { prize: 1000, weight: 200 }, { prize: 2000, weight: 70 },
      { prize: 3500, weight: 25 }, { prize: 5000, weight: 5 },
    ]
  }
};

function pickPrize(caseKey) {
  const c = CASES[caseKey];
  const total = c.prizes.reduce((s, p) => s + p.weight, 0);
  let r = Math.random() * total;
  for (const p of c.prizes) {
    r -= p.weight;
    if (r <= 0) return p.prize;
  }
  return c.prizes[0].prize;
}

function tierOf(prize, c) {
  const ratio = (prize - c.min) / (c.max - c.min);
  if (ratio >= 0.85) return 'legend';
  if (ratio >= 0.6)  return 'epic';
  if (ratio >= 0.35) return 'rare';
  return '';
}

function makeSlot(prize, c) {
  const el = document.createElement('div');
  const tier = tierOf(prize, c);
  el.className = 'slot' + (tier ? ' ' + tier : '');
  el.innerHTML = `<span>${prize}</span>${starIco()}`;
  return el;
}

const TRACK_SIZE = 60;
const STOP_INDEX = 50;

async function buyCase(caseKey) {
  initAudio(); haptic('light');
  const c = CASES[caseKey];
  if (state.balance < c.price) return toastText('Недостаточно звёзд');

  const ok = await spendAPI(c.price);
  if (!ok) return;
  toastDelta(-c.price);

  state.currentCase = caseKey;
  $('spinResult').className = 'spin-result';
  $('spinBtn').textContent = 'Открыть';
  $('spinBtn').disabled = false;
  $('spinBtn').onclick = spin;

  $('track').innerHTML = '';
  $('track').style.transition = 'none';
  $('track').style.transform = 'translateX(0)';

  showScreen('caseOpen');
}

function spin() {
  if (state.spinning) return;
  initAudio(); haptic('medium');
  state.spinning = true;
  $('spinBtn').disabled = true;
  $('spinBtn').textContent = '...';

  const caseKey = state.currentCase;
  const c = CASES[caseKey];
  const track = $('track');
  const winPrize = pickPrize(caseKey);

  track.innerHTML = '';
  for (let i = 0; i < TRACK_SIZE; i++) {
    let prize;
    if (i === STOP_INDEX) prize = winPrize;
    else if (Math.abs(i - STOP_INDEX) === 1) {
      const idx = c.prizes.findIndex(p => p.prize === winPrize);
      const neighborIdx = Math.max(0, Math.min(c.prizes.length - 1,
        idx + (Math.random() < 0.5 ? 1 : -1)));
      prize = c.prizes[neighborIdx].prize;
    } else {
      prize = c.prizes[Math.floor(Math.random() * c.prizes.length)].prize;
    }
    track.appendChild(makeSlot(prize, c));
  }

  void track.offsetWidth;

  const wrap = track.parentElement;
  const wrapW = wrap.clientWidth;
  const targetSlot = track.children[STOP_INDEX];
  const trackRect = track.getBoundingClientRect();
  const slotRect = targetSlot.getBoundingClientRect();
  const slotCenter = (slotRect.left - trackRect.left) + slotRect.width / 2;
  const targetX = wrapW / 2 - slotCenter;

  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  void track.offsetWidth;

  const duration = 5000;
  track.style.transition = `transform ${duration}ms cubic-bezier(0.12, 0.85, 0.18, 1)`;
  track.style.transform = `translateX(${targetX}px)`;

  let elapsed = 0;
  const tickSchedule = [];
  while (elapsed < duration - 200) {
    const interval = 40 + elapsed * 0.08;
    elapsed += interval;
    tickSchedule.push(elapsed);
  }
  tickSchedule.forEach(t => {
    setTimeout(() => tone(1200, 0.015, 'square', 0.02), t);
  });

  setTimeout(async () => {
    state.spinning = false;
    await finishSpin(winPrize, c);
  }, duration + 80);
}

async function finishSpin(prize, c) {
  await winAPI(prize);
  updateBalance();

  $('spinValue').innerHTML = fmt(prize) + ' ' + starIco();
  $('spinResult').className = 'spin-result show';

  haptic(prize >= c.price ? 'success' : 'error');
  toastDelta(prize);

  $('spinBtn').disabled = false;
  $('spinBtn').textContent = 'Ещё раз';
  $('spinBtn').onclick = () => {
    if (state.balance < c.price) return toastText('Недостаточно звёзд');
    buyCase(state.currentCase);
    setTimeout(spin, 250);
  };
}

/* ==================== ПРОМОКОД ==================== */
async function applyPromo() {
  haptic('light');
  const code = $('promoInput').value.trim().toUpperCase();
  if (!code) return toastText('Введи код');

  const uid = getUserId();
  if (!uid) return toastText('Открой из Telegram');

  try {
    const d = await apiCall('/api/promo/activate', { user_id: uid, code });
    state.balance = d.balance;
    state.withdrawable = d.withdrawable;
    updateBalance(); updateStatsUI();
    $('promoInput').value = '';
    haptic('success');
    toastDelta(d.stars);
  } catch (e) {
    toastText(e.message);
  }
}

/* ==================== ВЫВОД ==================== */
async function withdrawOpen() {
  haptic('light');
  const amountStr = prompt('Сколько вывести? (мин. 100 ★)');
  if (!amountStr) return;
  const amount = parseInt(amountStr, 10);
  if (!amount || amount < 100) return toastText('Минимум 100 ★');

  const uid = getUserId();
  if (!uid) return toastText('Открой из Telegram');

  try {
    await apiCall('/api/withdraw', { user_id: uid, amount });
    toastText('Заявка отправлена');
    await syncBalance();
  } catch (e) {
    toastText(e.message);
  }
}

updateStatsUI();
