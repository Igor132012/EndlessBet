<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EndlessBet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#0a0a1a; color:#fff; user-select:none;
  }
  body { background:radial-gradient(ellipse at top, #1a1a3a 0%, #0a0a1a 50%, #000 100%); }

  /* ===== Звёзды ===== */
  #stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .star { position:absolute; background:#fff; border-radius:50%; animation:twinkle 3s infinite ease-in-out; }
  @keyframes twinkle { 0%,100%{opacity:.2} 50%{opacity:1} }

  /* ===== Экраны ===== */
  .screen {
    position:fixed; inset:0; display:flex; flex-direction:column;
    z-index:1; transition:opacity .3s, transform .3s;
  }
  .screen.hidden { opacity:0; pointer-events:none; transform:scale(.96); }

  /* ===== Главное меню ===== */
  #menu { align-items:center; justify-content:center; padding:24px; text-align:center; }
  .logo {
    font-size:56px; margin-bottom:8px;
    animation:float 3s ease-in-out infinite;
    filter:drop-shadow(0 0 20px #00d4ff);
  }
  @keyframes float {
    0%,100% { transform:translateY(0) rotate(-5deg); }
    50% { transform:translateY(-12px) rotate(5deg); }
  }
  .title {
    font-size:30px; font-weight:800; letter-spacing:2px;
    background:linear-gradient(135deg, #00d4ff, #ff00e5, #ffb800);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text; margin-bottom:6px; animation:shimmer 3s infinite;
  }
  @keyframes shimmer { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.4)} }
  .subtitle { color:#7a7a9a; font-size:12px; margin-bottom:24px; letter-spacing:1px; }

  .balance-card {
    background:linear-gradient(135deg, rgba(0,212,255,.15), rgba(255,0,229,.15));
    border:1px solid rgba(0,212,255,.3); border-radius:20px;
    padding:18px 32px; margin-bottom:28px; backdrop-filter:blur(10px);
    box-shadow:0 8px 32px rgba(0,212,255,.2);
  }
  .balance-label { font-size:11px; color:#8a8aaa; letter-spacing:2px; text-transform:uppercase; }
  .balance-value { font-size:34px; font-weight:800; margin-top:4px; }
  .balance-value::after { content:" ⭐"; font-size:22px; }

  /* ===== Меню режимов ===== */
  .modes {
    display:flex; flex-direction:column; gap:14px; width:100%; max-width:340px;
  }
  .mode-btn {
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:18px; padding:18px 20px; color:#fff; cursor:pointer;
    display:flex; align-items:center; gap:14px;
    transition:all .2s; text-align:left; font-family:inherit;
  }
  .mode-btn:active { transform:scale(.97); background:rgba(255,255,255,.12); }
  .mode-btn .icon {
    width:44px; height:44px; border-radius:12px; display:flex;
    align-items:center; justify-content:center; font-size:22px; flex-shrink:0;
  }
  .mode-btn.crash .icon { background:linear-gradient(135deg,#ff00e5,#ff0080); box-shadow:0 0 20px rgba(255,0,229,.5); }
  .mode-btn.cases .icon { background:linear-gradient(135deg,#ffb800,#ff6b00); box-shadow:0 0 20px rgba(255,184,0,.5); }
  .mode-btn .text { flex:1; }
  .mode-btn .name { font-size:16px; font-weight:700; letter-spacing:.5px; }
  .mode-btn .desc { font-size:12px; color:#8a8aaa; margin-top:2px; }
  .mode-btn .arrow { color:#5a5a7a; font-size:18px; }

  /* ===== Верхняя панель игр ===== */
  .game-top {
    padding:16px 20px; display:flex; justify-content:space-between; align-items:center; z-index:2;
  }
  .back-btn {
    background:rgba(255,255,255,.08); border:none; color:#fff;
    width:40px; height:40px; border-radius:12px; font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:background .2s;
  }
  .back-btn:active { background:rgba(255,255,255,.2); }
  .game-balance {
    background:rgba(255,255,255,.08); padding:8px 16px; border-radius:12px;
    font-weight:700; font-size:15px;
  }
  .game-balance::after { content:" ⭐"; font-size:13px; }

  /* ===== КРАШ ===== */
  #crash { padding:0; }
  .crash-area {
    flex:1; display:flex; align-items:center; justify-content:center; position:relative;
  }
  .crash-multiplier {
    font-size:96px; font-weight:900; letter-spacing:-3px;
    color:#00ff88; text-shadow:0 0 40px currentColor;
    transition:color .3s, transform .15s;
  }
  .crash-multiplier.crashed {
    color:#ff2d55; animation:crashPulse .5s ease-out;
  }
  @keyframes crashPulse {
    0% { transform:scale(1); }
    40% { transform:scale(1.4); }
    100% { transform:scale(1); }
  }
  .crash-status {
    position:absolute; bottom:14%; font-size:14px; color:#8a8aaa; letter-spacing:1px;
    text-align:center; width:100%;
  }

  .controls { padding:16px 20px 28px; z-index:2; background:linear-gradient(to top, rgba(0,0,0,.6), transparent); }
  .bet-input-wrap {
    flex:1; position:relative;
    background:rgba(255,255,255,.06); border-radius:16px;
    border:1px solid rgba(255,255,255,.1);
    display:flex; align-items:center; padding:0 16px;
  }
  .bet-input-wrap:focus-within { border-color:#00d4ff; box-shadow:0 0 0 3px rgba(0,212,255,.2); }
  #betInput {
    flex:1; background:none; border:none; color:#fff; font-size:18px;
    font-weight:700; padding:16px 0; outline:none; width:100%;
  }
  #betInput::placeholder { color:#5a5a7a; }
  .bet-unit { color:#8a8aaa; font-size:16px; }
  .quick-bets { display:flex; gap:8px; margin-top:10px; }
  .quick-btn {
    flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
    color:#c0c0dd; padding:8px; border-radius:10px; font-size:12px; font-weight:600;
    cursor:pointer; transition:all .15s; font-family:inherit;
  }
  .quick-btn:active { background:rgba(0,212,255,.2); border-color:#00d4ff; }
  .btn-action {
    flex:1; padding:0 24px; border:none; border-radius:16px;
    font-size:17px; font-weight:800; letter-spacing:1px; cursor:pointer;
    color:#fff; transition:all .2s; min-height:56px; font-family:inherit;
    width:100%; margin-top:12px;
  }
  .btn-action:active { transform:scale(.96); }
  .btn-start {
    background:linear-gradient(135deg, #00d4ff, #0088ff);
    box-shadow:0 8px 24px rgba(0,212,255,.4);
  }
  .btn-cashout {
    background:linear-gradient(135deg, #00ff88, #00cc66);
    box-shadow:0 8px 24px rgba(0,255,136,.5);
    animation:cashPulse 1s infinite;
  }
  @keyframes cashPulse {
    0%,100% { box-shadow:0 8px 24px rgba(0,255,136,.5); }
    50% { box-shadow:0 8px 32px rgba(0,255,136,.9); }
  }
  .btn-action:disabled { background:rgba(255,255,255,.1); color:#5a5a7a; box-shadow:none; cursor:not-allowed; animation:none; }
  .cashout-info {
    text-align:center; font-size:14px; color:#00ff88; font-weight:700;
    margin-bottom:10px; min-height:20px; text-shadow:0 0 12px rgba(0,255,136,.6);
  }

  /* ===== КЕЙСЫ ===== */
  #cases { padding:0; }
  .case-select {
    flex:1; padding:24px 20px; display:flex; flex-direction:column; gap:16px;
    overflow-y:auto;
  }
  .case-select h2 { font-size:22px; margin-bottom:8px; letter-spacing:1px; text-align:center; }
  .case-select p { color:#8a8aaa; font-size:13px; text-align:center; margin-bottom:12px; }
  .case-card {
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
    border-radius:20px; padding:18px 20px; display:flex; align-items:center; gap:16px;
    cursor:pointer; transition:all .2s; font-family:inherit; color:#fff; text-align:left;
  }
  .case-card:active { transform:scale(.97); }
  .case-card.tier10 { border-color:rgba(0,212,255,.4); background:linear-gradient(135deg, rgba(0,212,255,.1), rgba(255,255,255,.03)); }
  .case-card.tier50 { border-color:rgba(255,184,0,.4); background:linear-gradient(135deg, rgba(255,184,0,.1), rgba(255,255,255,.03)); }
  .case-card.tier100 { border-color:rgba(255,0,229,.4); background:linear-gradient(135deg, rgba(255,0,229,.1), rgba(255,255,255,.03)); }
  .case-icon {
    width:56px; height:56px; border-radius:14px; display:flex;
    align-items:center; justify-content:center; font-size:28px; flex-shrink:0;
  }
  .case-card.tier10 .case-icon { background:linear-gradient(135deg,#00d4ff,#0088ff); box-shadow:0 0 20px rgba(0,212,255,.5); }
  .case-card.tier50 .case-icon { background:linear-gradient(135deg,#ffb800,#ff6b00); box-shadow:0 0 20px rgba(255,184,0,.5); }
  .case-card.tier100 .case-icon { background:linear-gradient(135deg,#ff00e9,#ff0080); box-shadow:0 0 20px rgba(255,0,229,.5); }
  .case-info { flex:1; }
  .case-name { font-size:16px; font-weight:700; }
  .case-range { font-size:12px; color:#8a8aaa; margin-top:4px; }
  .case-price { font-size:16px; font-weight:800; color:#ffb800; white-space:nowrap; }
  .case-price::after { content:" ⭐"; font-size:12px; }

  /* ===== ОТКРЫТИЕ КЕЙСА ===== */
  #caseOpen { padding:0; }
  .case-open-area {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .roulette-wrap {
    position:relative; width:100%; height:140px;
    background:rgba(0,0,0,.4); border-top:1px solid rgba(255,255,255,.1);
    border-bottom:1px solid rgba(255,255,255,.1);
    overflow:hidden;
  }
  .roulette-track {
    position:absolute; top:0; left:50%; height:100%;
    display:flex; align-items:center;
    will-change:transform;
  }
  .slot {
    width:100px; height:110px; margin:0 4px; flex-shrink:0;
    border-radius:12px; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    font-weight:800; font-size:18px;
  }
  .slot .slot-stars { font-size:20px; }
  .slot .slot-unit { font-size:11px; color:#8a8aaa; margin-top:2px; }
  .slot.common { background:rgba(90,90,120,.25); border-color:rgba(120,120,160,.4); }
  .slot.uncommon { background:rgba(0,212,255,.15); border-color:rgba(0,212,255,.5); color:#00d4ff; }
  .slot.rare { background:rgba(255,0,229,.15); border-color:rgba(255,0,229,.5); color:#ff6bff; }
  .slot.epic { background:rgba(255,184,0,.15); border-color:rgba(255,184,0,.5); color:#ffb800; }
  .slot.legendary {
    background:linear-gradient(135deg, rgba(255,0,229,.25), rgba(255,184,0,.25));
    border-color:#ffb800; color:#fff;
    box-shadow:0 0 20px rgba(255,184,0,.6), inset 0 0 20px rgba(255,0,229,.3);
    animation:legendaryGlow 1.5s infinite alternate;
  }
  @keyframes legendaryGlow {
    from { box-shadow:0 0 20px rgba(255,184,0,.6), inset 0 0 20px rgba(255,0,229,.3); }
    to { box-shadow:0 0 35px rgba(255,184,0,.9), inset 0 0 30px rgba(255,0,229,.5); }
  }
  .roulette-pointer {
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:4px; height:100%; background:linear-gradient(to bottom, #ff2d55, #ffb800);
    z-index:5; box-shadow:0 0 15px #ff2d55;
    border-radius:2px;
  }
  .roulette-pointer::before, .roulette-pointer::after {
    content:""; position:absolute; left:50%; transform:translateX(-50%);
    border-left:10px solid transparent; border-right:10px solid transparent;
  }
  .roulette-pointer::before {
    top:-2px; border-top:14px solid #ff2d55;
  }
  .roulette-pointer::after {
    bottom:-2px; border-bottom:14px solid #ff2d55;
  }

  .case-result {
    text-align:center; padding:20px; z-index:3;
  }
  .case-result .label { color:#8a8aaa; font-size:13px; letter-spacing:2px; text-transform:uppercase; }
  .case-result .value {
    font-size:48px; font-weight:900; margin-top:8px;
    background:linear-gradient(135deg,#ffb800,#ff6b00);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text; filter:drop-shadow(0 0 20px rgba(255,184,0,.6));
  }
  .case-result .value::after { content:" ⭐"; font-size:28px; }
  .case-result.win .value {
    background:linear-gradient(135deg,#00ff88,#00d4ff);
    -webkit-background-clip:text; background-clip:text;
    filter:drop-shadow(0 0 20px rgba(0,255,136,.6));
  }
  .case-result.lose .value {
    background:linear-gradient(135deg,#ff2d55,#ff6b00);
    -webkit-background-clip:text; background-clip:text;
  }
  .case-open-btn-wrap { padding:0 20px 28px; }

  /* ===== Тост ===== */
  #toast {
    position:fixed; top:80px; left:50%; transform:translateX(-50%) translateY(-100px);
    background:rgba(0,0,0,.9); color:#fff; padding:14px 24px; border-radius:14px;
    font-weight:700; font-size:15px; z-index:100;
    transition:transform .4s cubic-bezier(.34,1.56,.64,1);
    border:1px solid rgba(255,255,255,.15); backdrop-filter:blur(10px);
    pointer-events:none; white-space:nowrap;
  }
  #toast.show { transform:translateX(-50%) translateY(0); }
  #toast.win { border-color:#00ff88; box-shadow:0 0 24px rgba(0,255,136,.5); }
  #toast.lose { border-color:#ff2d55; box-shadow:0 0 24px rgba(255,45,85,.5); }

  #flash { position:fixed; inset:0; background:#ff2d55; opacity:0; pointer-events:none; z-index:99; transition:opacity .4s; }
  #flash.active { opacity:.35; }
</style>
</head>
<body>

<div id="stars"></div>

<!-- ============ ГЛАВНОЕ МЕНЮ ============ -->
<div class="screen" id="menu">
  <div class="logo">💎</div>
  <div class="title">ENDLESS BET</div>
  <div class="subtitle">ВЫБЕРИ РЕЖИМ</div>

  <div class="balance-card">
    <div class="balance-label">Баланс</div>
    <div class="balance-value" id="menuBalance">1000</div>
  </div>

  <div class="modes">
    <button class="mode-btn crash" onclick="openMode('crash')">
      <div class="icon">📈</div>
      <div class="text">
        <div class="name">КРАШ</div>
        <div class="desc">Успей забрать до краха</div>
      </div>
      <div class="arrow">›</div>
    </button>
    <button class="mode-btn cases" onclick="openMode('cases')">
      <div class="icon">🎁</div>
      <div class="text">
        <div class="name">КЕЙСЫ</div>
        <div class="desc">Испытай удачу</div>
      </div>
      <div class="arrow">›</div>
    </button>
  </div>

  <button class="btn-action btn-start" style="max-width:340px; margin-top:24px;" onclick="resetBalance()">Сбросить баланс</button>
</div>

<!-- ============ КРАШ ============ -->
<div class="screen hidden" id="crash">
  <div class="game-top">
    <button class="back-btn" onclick="backToMenu()">←</button>
    <div class="game-balance" id="crashBalance">1000</div>
  </div>

  <div class="crash-area">
    <div class="crash-multiplier" id="multiplier">1.00x</div>
    <div class="crash-status" id="crashStatus">Введи ставку и нажми СТАРТ</div>
  </div>

  <div class="controls">
    <div class="cashout-info" id="cashoutInfo"></div>
    <div class="bet-input-wrap">
      <input type="number" id="betInput" placeholder="Ставка" value="50" min="1">
      <span class="bet-unit">⭐</span>
    </div>
    <div class="quick-bets" id="quickBets">
      <button class="quick-btn" onclick="setBet(10)">10</button>
      <button class="quick-btn" onclick="setBet(50)">50</button>
      <button class="quick-btn" onclick="setBet(100)">100</button>
      <button class="quick-btn" onclick="setBet(500)">500</button>
      <button class="quick-btn" onclick="setBet('all')">MAX</button>
    </div>
    <button class="btn-action btn-start" id="actionBtn" onclick="handleCrashAction()">СТАРТ</button>
  </div>
</div>

<!-- ============ ВЫБОР КЕЙСА ============ -->
<div class="screen hidden" id="cases">
  <div class="game-top">
    <button class="back-btn" onclick="backToMenu()">←</button>
    <div class="game-balance" id="casesBalance">1000</div>
  </div>

  <div class="case-select">
    <h2>КЕЙСЫ</h2>
    <p>Выбери кейс — чем дороже, тем крупнее призы</p>

    <button class="case-card tier10" onclick="openCase('case10')">
      <div class="case-icon">🎁</div>
      <div class="case-info">
        <div class="case-name">Обычный кейс</div>
        <div class="case-range">от 1 ⭐ до 1000 ⭐</div>
      </div>
      <div class="case-price">10</div>
    </button>

    <button class="case-card tier50" onclick="openCase('case50')">
      <div class="case-icon">🎁</div>
      <div class="case-info">
        <div class="case-name">Редкий кейс</div>
        <div class="case-range">от 5 ⭐ до 2000 ⭐</div>
      </div>
      <div class="case-price">50</div>
    </button>

    <button class="case-card tier100" onclick="openCase('case100')">
      <div class="case-icon">💎</div>
      <div class="case-info">
        <div class="case-name">Легендарный кейс</div>
        <div class="case-range">от 10 ⭐ до 5000 ⭐</div>
      </div>
      <div class="case-price">100</div>
    </button>
  </div>
</div>

<!-- ============ ОТКРЫТИЕ КЕЙСА ============ -->
<div class="screen hidden" id="caseOpen">
  <div class="game-top">
    <button class="back-btn" onclick="closeCase()">←</button>
    <div class="game-balance" id="openBalance">1000</div>
  </div>

  <div class="case-open-area">
    <div class="roulette-wrap">
      <div class="roulette-track" id="rouletteTrack"></div>
      <div class="roulette-pointer"></div>
    </div>

    <div class="case-result" id="caseResult" style="opacity:0;">
      <div class="label">Твой выигрыш</div>
      <div class="value" id="caseResultValue">0</div>
    </div>
  </div>

  <div class="case-open-btn-wrap" id="caseOpenBtnWrap">
    <button class="btn-action btn-start" id="caseOpenBtn" onclick="startCaseSpin()">ОТКРЫТЬ</button>
  </div>
</div>

<div id="flash"></div>
<div id="toast"></div>

<script>
/* ==================== TELEGRAM ==================== */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ==================== СОСТОЯНИЕ ==================== */
const state = {
  balance: 1000,
  // Краш
  crashPhase: 'idle',   // idle | flying | crashed | cashed
  crashMultiplier: 1.0,
  crashAt: 2.0,
  crashStart: 0,
  crashBet: 0,
  crashRaf: null,
  // Кейс
  caseSpinning: false,
  currentCase: null,
};

/* ==================== DOM ==================== */
const $ = id => document.getElementById(id);

/* ==================== ЗВЁЗДЫ ==================== */
(function makeStars(){
  const box = $('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 1;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s`;
    box.appendChild(s);
  }
})();

/* ==================== ЗВУК ==================== */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function initAudio() { if (!actx) actx = new AudioCtx(); if (actx.state === 'suspended') actx.resume(); }
function beep(freq, dur, type='sine', vol=0.08) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}
function sfxStart() { initAudio(); beep(220,0.1,'sawtooth'); setTimeout(()=>beep(330,0.1,'sawtooth'),80); }
function sfxTick() { if (actx) beep(600, 0.02, 'square', 0.02); }
function sfxCrash() {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(400, actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(40, actx.currentTime + 0.6);
  g.gain.setValueAtTime(0.2, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.6);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + 0.6);
}
function sfxCashout() { initAudio(); beep(660,0.1); setTimeout(()=>beep(880,0.1),80); setTimeout(()=>beep(1320,0.15),160); }
function sfxWin() { initAudio(); [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.15,'triangle',0.1),i*90)); }
function sfxLose() { initAudio(); beep(220,0.3,'sawtooth',0.08); setTimeout(()=>beep(160,0.4,'sawtooth',0.08),150); }

/* ==================== HAPTIC ==================== */
function haptic(type) {
  if (!tg?.HapticFeedback) return;
  if (type === 'light') tg.HapticFeedback.impactOccurred('light');
  if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
  if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
  if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
  if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
}

/* ==================== UI ==================== */
function updateBalance() {
  const b = Math.floor(state.balance);
  $('menuBalance').textContent = b;
  $('crashBalance').textContent = b;
  $('casesBalance').textContent = b;
  $('openBalance').textContent = b;
}
function toast(msg, kind='') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show ' + kind;
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = kind, 2200);
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  $(id).classList.remove('hidden');
}

/* ==================== НАВИГАЦИЯ ==================== */
function openMode(mode) {
  initAudio(); haptic('light');
  if (mode === 'crash') {
    showScreen('crash');
    $('betInput').value = Math.min(50, Math.max(1, Math.floor(state.balance)));
  } else if (mode === 'cases') {
    showScreen('cases');
  }
  updateBalance();
}
function backToMenu() {
  haptic('light');
  if (state.crashPhase === 'flying') cashoutCrash();
  cancelAnimationFrame(state.crashRaf);
  state.crashPhase = 'idle';
  showScreen('menu');
  updateBalance();
}
function closeCase() {
  haptic('light');
  if (state.caseSpinning) return;
  showScreen('cases');
  updateBalance();
}
function resetBalance() {
  haptic('light');
  state.balance = 1000;
  updateBalance();
  toast('Баланс восстановлен', 'win');
}

/* ==================== КРАШ ==================== */
function generateCrashPoint() {
  const r = Math.random();
  if (r < 0.03) return 1.0 + Math.random() * 0.2;
  const raw = 0.92 / (1 - r);
  return Math.max(1.01, Math.floor(raw * 100) / 100);
}

function startCrashRound() {
  const bet = Math.floor(Number($('betInput').value) || 0);
  if (bet <= 0) return toast('Введи ставку', 'lose');
  if (bet > state.balance) return toast('Недостаточно звёзд', 'lose');

  state.crashBet = bet;
  state.balance -= bet;
  updateBalance();

  state.crashPhase = 'flying';
  state.crashMultiplier = 1.0;
  state.crashAt = generateCrashPoint();
  state.crashStart = performance.now();

  $('quickBets').style.display = 'none';
  $('betInput').parentElement.style.display = 'none';
  $('actionBtn').textContent = 'ЗАБРАТЬ';
  $('actionBtn').className = 'btn-action btn-cashout';
  $('actionBtn').disabled = false;
  $('crashStatus').textContent = `Ставка: ${bet} ⭐`;
  $('multiplier').className = 'crash-multiplier';
  $('multiplier').style.color = '#00ff88';

  sfxStart(); haptic('medium');
  state.crashRaf = requestAnimationFrame(crashLoop);
}

function crashLoop(now) {
  if (state.crashPhase !== 'flying') return;
  const elapsed = (now - state.crashStart) / 1000;
  const m = Math.pow(1.0718, elapsed * 1.6);
  state.crashMultiplier = m;

  if (m >= state.crashAt) {
    state.crashMultiplier = state.crashAt;
    return crashBoom();
  }

  // UI
  $('multiplier').textContent = m.toFixed(2) + 'x';
  const hue = Math.max(0, 140 - (m - 1) * 20);
  $('multiplier').style.color = `hsl(${hue}, 100%, 60%)`;
  const scale = Math.min(1 + (m - 1) * 0.05, 1.5);
  $('multiplier').style.transform = `scale(${scale})`;

  const potential = Math.floor(state.crashBet * m);
  $('cashoutInfo').textContent = `Забрать: ${potential} ⭐ (+${potential - state.crashBet})`;

  state.crashRaf = requestAnimationFrame(crashLoop);
}

function crashBoom() {
  state.crashPhase = 'crashed';
  cancelAnimationFrame(state.crashRaf);
  sfxCrash(); haptic('error');

  const el = $('multiplier');
  el.className = 'crash-multiplier crashed';
  el.textContent = state.crashAt.toFixed(2) + 'x';
  el.style.transform = 'scale(1)';
  $('crashStatus').textContent = `💥 КРАХ на ${state.crashAt.toFixed(2)}x — ставка сгорела`;
  $('cashoutInfo').textContent = '';

  $('flash').classList.add('active');
  setTimeout(() => $('flash').classList.remove('active'), 150);

  setTimeout(() => endCrashRound(), 1800);
}

function cashoutCrash() {
  if (state.crashPhase !== 'flying') return;
  state.crashPhase = 'cashed';
  cancelAnimationFrame(state.crashRaf);
  sfxCashout(); haptic('success');

  const win = Math.floor(state.crashBet * state.crashMultiplier);
  const profit = win - state.crashBet;
  state.balance += win;
  updateBalance();

  $('multiplier').style.color = '#00ff88';
  $('crashStatus').textContent = `✅ Забрано ${win} ⭐ (+${profit})`;
  $('cashoutInfo').textContent = '';
  toast(`+${win} ⭐`, 'win');

  setTimeout(() => endCrashRound(), 1400);
}

function endCrashRound() {
  state.crashPhase = 'idle';
  $('multiplier').textContent = '1.00x';
  $('multiplier').className = 'crash-multiplier';
  $('multiplier').style.color = '#00ff88';
  $('multiplier').style.transform = 'scale(1)';
  $('crashStatus').textContent = 'Введи ставку и нажми СТАРТ';
  $('quickBets').style.display = 'flex';
  $('betInput').parentElement.style.display = 'flex';
  $('actionBtn').textContent = 'СТАРТ';
  $('actionBtn').className = 'btn-action btn-start';
  $('cashoutInfo').textContent = '';
}

function handleCrashAction() {
  initAudio();
  if (state.crashPhase === 'flying') cashoutCrash();
  else if (state.crashPhase === 'idle') startCrashRound();
}
function setBet(v) {
  haptic('light');
  if (v === 'all') $('betInput').value = Math.max(1, Math.floor(state.balance));
  else $('betInput').value = v;
}

/* ==================== КЕЙСЫ ==================== */
// Каждый кейс: массив слотов с prize и weight (вес = шанс)
// Чем выше вес — тем чаще выпадает
const CASES = {
  case10: {
    price: 10,
    min: 1, max: 1000,
    prizes: [
      // Приз, вес
      { prize: 1,    weight: 3500 },  // 35%
      { prize: 2,    weight: 2500 },  // 25%
      { prize: 5,    weight: 1500 },  // 15%
      { prize: 10,   weight: 1000 },  // 10%
      { prize: 25,   weight: 700 },   // 7%
      { prize: 50,   weight: 500 },   // 5%
      { prize: 100,  weight: 200 },   // 2%
      { prize: 250,  weight: 70 },    // 0.7%
      { prize: 500,  weight: 25 },    // 0.25%
      { prize: 1000, weight: 5 },     // 0.05%
    ]
  },
  case50: {
    price: 50,
    min: 5, max: 2000,
    prizes: [
      { prize: 5,    weight: 3500 },
      { prize: 15,   weight: 2500 },
      { prize: 30,   weight: 1500 },
      { prize: 60,   weight: 1000 },
      { prize: 100,  weight: 700 },
      { prize: 200,  weight: 500 },
      { prize: 400,  weight: 200 },
      { prize: 700,  weight: 70 },
      { prize: 1200, weight: 25 },
      { prize: 2000, weight: 5 },
    ]
  },
  case100: {
    price: 100,
    min: 10, max: 5000,
    prizes: [
      { prize: 10,   weight: 3500 },
      { prize: 30,   weight: 2500 },
      { prize: 70,   weight: 1500 },
      { prize: 150,  weight: 1000 },
      { prize: 300,  weight: 700 },
      { prize: 600,  weight: 500 },
      { prize: 1000, weight: 200 },
      { prize: 2000, weight: 70 },
      { prize: 3500, weight: 25 },
      { prize: 5000, weight: 5 },
    ]
  }
};

function pickPrize(caseKey) {
  const c = CASES[caseKey];
  const total = c.prizes.reduce((s, p) => s + p.weight, 0);
  let r = Math.random() * total;
  for (const p of c.prizes) {
    r -= p.weight;
    if (r <= 0) return p.prize;
  }
  return c.prizes[0].prize;
}

function prizeTier(prize, caseKey) {
  const c = CASES[caseKey];
  const ratio = (prize - c.min) / (c.max - c.min);
  if (ratio >= 0.85) return 'legendary';
  if (ratio >= 0.6)  return 'epic';
  if (ratio >= 0.35) return 'rare';
  if (ratio >= 0.15) return 'uncommon';
  return 'common';
}

function makeSlot(prize, caseKey) {
  const el = document.createElement('div');
  const tier = prizeTier(prize, caseKey);
  el.className = 'slot ' + tier;
  el.innerHTML = `<div class="slot-stars">${prize} ⭐</div><div class="slot-unit">${tier === 'legendary' ? 'ЛЕГЕНДА' : tier === 'epic' ? 'ЭПИК' : tier === 'rare' ? 'РЕДКО' : tier === 'uncommon' ? 'НЕОБЫЧ.' : 'ОБЫЧН.'}</div>`;
  return el;
}

function openCase(caseKey) {
  initAudio(); haptic('light');
  const c = CASES[caseKey];
  if (state.balance < c.price) return toast('Недостаточно звёзд', 'lose');

  state.currentCase = caseKey;
  state.balance -= c.price;
  updateBalance();

  // Очищаем трек
  const track = $('rouletteTrack');
  track.innerHTML = '';
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';

  // Результат (скрыт)
  $('caseResult').style.opacity = '0';
  $('caseOpenBtn').disabled = false;
  $('caseOpenBtn').textContent = 'ОТКРЫТЬ';

  // Заполняем трек случайными слотами для визуала
  // Мы генерируем 50 слотов, а реальный приз будет выбран на момент прокрутки
  for (let i = 0; i < 60; i++) {
    const rnd = c.prizes[Math.floor(Math.random() * c.prizes.length)].prize;
    track.appendChild(makeSlot(rnd, caseKey));
  }

  showScreen('caseOpen');
  toast(`Кейс куплен за ${c.price} ⭐`, '');
}

function startCaseSpin() {
  if (state.caseSpinning) return;
  initAudio(); haptic('medium');
  state.caseSpinning = true;
  $('caseOpenBtn').disabled = true;

  const caseKey = state.currentCase;
  const c = CASES[caseKey];
  const track = $('rouletteTrack');

  // Реальный выигрыш
  const winPrize = pickPrize(caseKey);

  // Строим новый трек: 60 слотов, и в позиции, например, 52-й — выигрыш
  track.innerHTML = '';
  const WIN_INDEX = 52;
  for (let i = 0; i < 60; i++) {
    let prize;
    if (i === WIN_INDEX) {
      prize = winPrize;
    } else {
      // Соседние слоты вокруг выигрыша делаем "почти как выигрыш", чтобы драма была
      if (Math.abs(i - WIN_INDEX) === 1) {
        // Рядом — другой приз, но иногда "дорогой", чтобы обмануть ожидания
        prize = c.prizes[Math.min(c.prizes.length - 1, c.prizes.findIndex(p => p.prize === winPrize) + 1)]?.prize 
                || c.prizes[0].prize;
      } else {
        prize = c.prizes[Math.floor(Math.random() * c.prizes.length)].prize;
      }
    }
    track.appendChild(makeSlot(prize, caseKey));
  }

  // Вычисляем позицию для остановки
  const wrapW = track.parentElement.clientWidth;
  const slotW = 108; // 100 + 4*2 margin
  // Слот WIN_INDEX должен оказаться по центру
  const targetOffset = -(WIN_INDEX * slotW + slotW / 2 - wrapW / 2);
  // Небольшой случайный разброс, чтобы не всегда точно по центру
  const jitter = (Math.random() - 0.5) * (slotW * 0.5);
  const finalOffset = targetOffset + jitter;

  // Анимация
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  // Форсируем reflow
  void track.offsetWidth;

  const duration = 4500 + Math.random() * 1500;
  track.style.transition = `transform ${duration}ms cubic-bezier(0.15, 0.8, 0.2, 1)`;
  track.style.transform = `translateX(${finalOffset}px)`;

  // Тики во время прокрутки
  let ticks = 0;
  const tickInterval = setInterval(() => {
    ticks++;
    if (ticks % 2 === 0) sfxTick();
  }, 100);
  setTimeout(() => clearInterval(tickInterval), duration - 200);

  // Финал
  setTimeout(() => {
    state.caseSpinning = false;
    finishCase(winPrize, caseKey);
  }, duration + 100);
}

function finishCase(prize, caseKey) {
  state.balance += prize;
  updateBalance();

  const res = $('caseResult');
  res.style.opacity = '1';

  const c = CASES[caseKey];
  const isProfit = prize >= c.price;
  const isJackpot = prizeTier(prize, caseKey) === 'legendary' || prizeTier(prize, caseKey) === 'epic';

  $('caseResultValue').textContent = prize;

  if (isJackpot) {
    res.className = 'case-result win';
    sfxWin(); haptic('success');
    toast(`🎉 ДЖЕКПОТ! +${prize} ⭐`, 'win');
    // Вспышка золотым
    $('flash').style.background = '#ffb800';
    $('flash').classList.add('active');
    setTimeout(() => { $('flash').classList.remove('active'); $('flash').style.background = '#ff2d55'; }, 200);
  } else if (isProfit) {
    res.className = 'case-result win';
    sfxWin(); haptic('success');
    toast(`+${prize} ⭐`, 'win');
  } else {
    res.className = 'case-result lose';
    sfxLose(); haptic('error');
    toast(`Выпало ${prize} ⭐`, 'lose');
  }

  $('caseOpenBtn').disabled = false;
  $('caseOpenBtn').textContent = 'ЕЩЁ РАЗ';
  $('caseOpenBtn').onclick = () => {
    if (state.balance < c.price) {
      toast('Недостаточно звёзд', 'lose');
      return;
    }
    openCase(caseKey);
    // Автостарт через мгновение
    setTimeout(() => startCaseSpin(), 300);
  };
}

/* ==================== INIT ==================== */
updateBalance();
</script>
