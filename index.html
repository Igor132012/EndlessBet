<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🚀 Rocket Crash</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#0a0a1a; color:#fff;
    user-select:none;
  }
  body {
    background:radial-gradient(ellipse at top, #1a1a3a 0%, #0a0a1a 50%, #000 100%);
  }

  /* ===== Звёздный фон ===== */
  #stars {
    position:fixed; inset:0; pointer-events:none; z-index:0;
  }
  .star {
    position:absolute; background:#fff; border-radius:50%;
    animation:twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle {
    0%,100% { opacity:0.2; }
    50% { opacity:1; }
  }

  /* ===== Экраны ===== */
  .screen {
    position:fixed; inset:0; display:flex; flex-direction:column;
    z-index:1; transition:opacity .3s, transform .3s;
  }
  .screen.hidden { opacity:0; pointer-events:none; transform:scale(0.95); }

  /* ===== Главное меню ===== */
  #menu {
    align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  .logo {
    font-size:64px; margin-bottom:8px;
    animation:float 3s ease-in-out infinite;
    filter:drop-shadow(0 0 20px #00d4ff);
  }
  @keyframes float {
    0%,100% { transform:translateY(0) rotate(-5deg); }
    50% { transform:translateY(-15px) rotate(5deg); }
  }
  .title {
    font-size:32px; font-weight:800; letter-spacing:2px;
    background:linear-gradient(135deg, #00d4ff, #ff00e5, #ffb800);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:6px;
    animation:shimmer 3s infinite;
  }
  @keyframes shimmer {
    0%,100% { filter:brightness(1); }
    50% { filter:brightness(1.4); }
  }
  .subtitle { color:#7a7a9a; font-size:13px; margin-bottom:32px; letter-spacing:1px; }

  .balance-card {
    background:linear-gradient(135deg, rgba(0,212,255,0.15), rgba(255,0,229,0.15));
    border:1px solid rgba(0,212,255,0.3);
    border-radius:20px; padding:20px 32px; margin-bottom:32px;
    backdrop-filter:blur(10px);
    box-shadow:0 8px 32px rgba(0,212,255,0.2);
  }
  .balance-label { font-size:11px; color:#8a8aaa; letter-spacing:2px; text-transform:uppercase; }
  .balance-value { font-size:36px; font-weight:800; margin-top:4px; }
  .balance-value::after { content:" ⭐"; font-size:24px; }

  .btn {
    border:none; border-radius:16px; padding:18px 48px;
    font-size:17px; font-weight:700; letter-spacing:1px; cursor:pointer;
    color:#fff; transition:all .2s; position:relative; overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .btn:active { transform:scale(0.95); }
  .btn-primary {
    background:linear-gradient(135deg, #ff00e5, #ff0080);
    box-shadow:0 8px 32px rgba(255,0,229,0.5);
  }
  .btn-primary::before {
    content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transform:translateX(-100%);
    animation:shine 2.5s infinite;
  }
  @keyframes shine {
    100% { transform:translateX(100%); }
  }
  .btn-secondary {
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    margin-top:16px; padding:12px 32px; font-size:14px;
  }

  /* ===== Игровой экран ===== */
  #game { padding:0; }

  .game-top {
    padding:16px 20px; display:flex; justify-content:space-between; align-items:center;
    z-index:2;
  }
  .back-btn {
    background:rgba(255,255,255,0.08); border:none; color:#fff;
    width:40px; height:40px; border-radius:12px; font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s;
  }
  .back-btn:active { background:rgba(255,255,255,0.2); }
  .game-balance {
    background:rgba(255,255,255,0.08); padding:8px 16px; border-radius:12px;
    font-weight:700; font-size:15px;
  }
  .game-balance::after { content:" ⭐"; font-size:13px; }

  .canvas-wrap {
    flex:1; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  #gameCanvas { position:absolute; inset:0; width:100%; height:100%; }

  /* Ракета */
  .rocket {
    position:absolute; font-size:44px; z-index:3;
    transition:transform .1s;
    filter:drop-shadow(0 0 12px #00d4ff);
  }
  .rocket-flying { animation:rocketShake 0.15s infinite; }
  @keyframes rocketShake {
    0%,100% { transform:translate(-50%,-50%) rotate(0deg); }
    50% { transform:translate(-50%,-50%) rotate(2deg); }
  }
  .rocket-flame {
    position:absolute; bottom:-20px; left:50%; transform:translateX(-50%);
    font-size:24px; animation:flicker 0.1s infinite;
  }
  @keyframes flicker {
    0%,100% { opacity:1; transform:translateX(-50%) scale(1); }
    50% { opacity:0.6; transform:translateX(-50%) scale(1.2); }
  }

  /* Множитель */
  .multiplier {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:72px; font-weight:900; letter-spacing:-2px;
    z-index:4; pointer-events:none;
    text-shadow:0 0 30px currentColor;
    transition:opacity .2s;
  }
  .multiplier.playing { color:#00ff88; }
  .multiplier.crashed {
    color:#ff2d55;
    animation:crashPulse .5s ease-out;
  }
  @keyframes crashPulse {
    0% { transform:translate(-50%,-50%) scale(1); }
    40% { transform:translate(-50%,-50%) scale(1.5); }
    100% { transform:translate(-50%,-50%) scale(1); }
  }

  /* Частицы взрыва */
  .particle {
    position:absolute; width:8px; height:8px; border-radius:50%;
    pointer-events:none; z-index:5;
  }

  /* Панель управления */
  .controls {
    padding:16px 20px 28px; z-index:2;
    background:linear-gradient(to top, rgba(0,0,0,0.6), transparent);
  }

  .bet-panel, .action-panel {
    display:flex; gap:12px; align-items:stretch;
  }

  .bet-input-wrap {
    flex:1; position:relative;
    background:rgba(255,255,255,0.06); border-radius:16px;
    border:1px solid rgba(255,255,255,0.1);
    display:flex; align-items:center; padding:0 16px;
  }
  .bet-input-wrap:focus-within { border-color:#00d4ff; box-shadow:0 0 0 3px rgba(0,212,255,0.2); }
  #betInput {
    flex:1; background:none; border:none; color:#fff; font-size:18px;
    font-weight:700; padding:16px 0; outline:none; width:100%;
  }
  #betInput::placeholder { color:#5a5a7a; }
  .bet-unit { color:#8a8aaa; font-size:16px; }

  .quick-bets {
    display:flex; gap:8px; margin-top:10px;
  }
  .quick-btn {
    flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
    color:#c0c0dd; padding:8px; border-radius:10px; font-size:12px; font-weight:600;
    cursor:pointer; transition:all .15s;
  }
  .quick-btn:active { background:rgba(0,212,255,0.2); border-color:#00d4ff; }

  .btn-action {
    flex:1; padding:0 24px; border:none; border-radius:16px;
    font-size:17px; font-weight:800; letter-spacing:1px; cursor:pointer;
    color:#fff; transition:all .2s;
    min-height:56px;
  }
  .btn-action:active { transform:scale(0.96); }
  .btn-start {
    background:linear-gradient(135deg, #00d4ff, #0088ff);
    box-shadow:0 8px 24px rgba(0,212,255,0.4);
  }
  .btn-cashout {
    background:linear-gradient(135deg, #00ff88, #00cc66);
    box-shadow:0 8px 24px rgba(0,255,136,0.5);
    animation:cashPulse 1s infinite;
  }
  @keyframes cashPulse {
    0%,100% { box-shadow:0 8px 24px rgba(0,255,136,0.5); }
    50% { box-shadow:0 8px 32px rgba(0,255,136,0.9); }
  }
  .btn-action:disabled {
    background:rgba(255,255,255,0.1); color:#5a5a7a;
    box-shadow:none; cursor:not-allowed; animation:none;
  }

  .cashout-info {
    text-align:center; font-size:14px; color:#00ff88; font-weight:700;
    margin-bottom:10px; min-height:20px;
    text-shadow:0 0 12px rgba(0,255,136,0.6);
  }

  /* Тост-уведомления */
  #toast {
    position:fixed; top:80px; left:50%; transform:translateX(-50%) translateY(-100px);
    background:rgba(0,0,0,0.9); color:#fff; padding:14px 24px; border-radius:14px;
    font-weight:700; font-size:15px; z-index:100;
    transition:transform .4s cubic-bezier(0.34,1.56,0.64,1);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    pointer-events:none; white-space:nowrap;
  }
  #toast.show { transform:translateX(-50%) translateY(0); }
  #toast.win { border-color:#00ff88; box-shadow:0 0 24px rgba(0,255,136,0.5); }
  #toast.lose { border-color:#ff2d55; box-shadow:0 0 24px rgba(255,45,85,0.5); }

  /* Вспышка при крахе */
  #flash {
    position:fixed; inset:0; background:#ff2d55; opacity:0; pointer-events:none; z-index:99;
    transition:opacity .4s;
  }
  #flash.active { opacity:0.35; }
</style>
</head>
<body>

<div id="stars"></div>

<!-- ============ ГЛАВНОЕ МЕНЮ ============ -->
<div class="screen" id="menu">
  <div class="logo">🚀</div>
  <div class="title">ROCKET CRASH</div>
  <div class="subtitle">УСПЕЙ ЗАБРАТЬ — ИЛИ ВСЁ СГОРИТ</div>

  <div class="balance-card">
    <div class="balance-label">Баланс</div>
    <div class="balance-value" id="menuBalance">1000</div>
  </div>

  <button class="btn btn-primary" onclick="startGame()">ИГРАТЬ</button>
  <button class="btn btn-secondary" onclick="resetBalance()">Сбросить баланс</button>
</div>

<!-- ============ ИГРА ============ -->
<div class="screen hidden" id="game">
  <div class="game-top">
    <button class="back-btn" onclick="exitGame()">←</button>
    <div class="game-balance" id="gameBalance">1000</div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="gameCanvas"></canvas>
    <div class="rocket" id="rocket" style="display:none; left:50%; top:50%;">🚀
      <div class="rocket-flame" id="flame" style="display:none;">🔥</div>
    </div>
    <div class="multiplier" id="multiplier" style="display:none;">1.00x</div>
  </div>

  <div class="controls">
    <div class="cashout-info" id="cashoutInfo"></div>

    <div class="bet-panel" id="betPanel">
      <div class="bet-input-wrap">
        <input type="number" id="betInput" placeholder="Ставка" value="50" min="1">
        <span class="bet-unit">⭐</span>
      </div>
    </div>
    <div class="quick-bets" id="quickBets">
      <button class="quick-btn" onclick="setBet(10)">10</button>
      <button class="quick-btn" onclick="setBet(50)">50</button>
      <button class="quick-btn" onclick="setBet(100)">100</button>
      <button class="quick-btn" onclick="setBet(500)">500</button>
      <button class="quick-btn" onclick="setBet('all')">MAX</button>
    </div>

    <div class="action-panel" style="margin-top:12px;">
      <button class="btn-action btn-start" id="actionBtn" onclick="handleAction()">СТАРТ</button>
    </div>
  </div>
</div>

<div id="flash"></div>
<div id="toast"></div>

<script>
/* ==================== TELEGRAM ==================== */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ==================== СОСТОЯНИЕ ==================== */
const state = {
  balance: 1000,
  bet: 50,
  phase: 'idle',       // idle | flying | crashed | cashed
  multiplier: 1.0,
  crashAt: 2.0,
  startTime: 0,
  rafId: null,
  rocketPos: { x: 0.5, y: 0.8 },
  particles: [],
};

/* ==================== DOM ==================== */
const $ = id => document.getElementById(id);
const menuScreen = $('menu'), gameScreen = $('game');
const menuBalance = $('menuBalance'), gameBalance = $('gameBalance');
const betInput = $('betInput'), rocket = $('rocket'), flame = $('flame');
const multiplierEl = $('multiplier'), actionBtn = $('actionBtn');
const cashoutInfo = $('cashoutInfo'), betPanel = $('betPanel');
const quickBets = $('quickBets'), canvas = $('gameCanvas');
const ctx = canvas.getContext('2d');
const flash = $('flash'), toastEl = $('toast');
const canvasWrap = $('canvasWrap');

/* ==================== ЗВЁЗДЫ ==================== */
(function makeStars(){
  const box = $('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 1;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s`;
    box.appendChild(s);
  }
})();

/* ==================== ЗВУК (WebAudio, без файлов) ==================== */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function initAudio() { if (!actx) actx = new AudioCtx(); if (actx.state === 'suspended') actx.resume(); }
function beep(freq, dur, type='sine', vol=0.08) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}
function sfxStart() { initAudio(); beep(220, 0.1, 'sawtooth'); setTimeout(()=>beep(330,0.1,'sawtooth'),80); }
function sfxTick(m) { if (!actx) return; beep(300 + m * 40, 0.03, 'square', 0.03); }
function sfxCrash() {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(400, actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(40, actx.currentTime + 0.6);
  g.gain.setValueAtTime(0.2, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.6);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + 0.6);
}
function sfxCashout() { initAudio(); beep(660,0.1); setTimeout(()=>beep(880,0.1),80); setTimeout(()=>beep(1320,0.15),160); }

/* ==================== HAPTIC ==================== */
function haptic(type) {
  if (!tg?.HapticFeedback) return;
  if (type === 'light') tg.HapticFeedback.impactOccurred('light');
  if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
  if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
  if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
  if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
}

/* ==================== UI HELPERS ==================== */
function updateBalance() {
  menuBalance.textContent = Math.floor(state.balance);
  gameBalance.textContent = Math.floor(state.balance);
}
function toast(msg, kind='') {
  toastEl.textContent = msg;
  toastEl.className = 'show ' + kind;
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.className = kind, 2000);
}

/* ==================== CANVAS ==================== */
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const r = canvasWrap.getBoundingClientRect();
  canvas.width = r.width * dpr;
  canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);

/* ==================== ИГРОВАЯ ЛОГИКА ==================== */
function generateCrashPoint() {
  // Provably-ish: 92% шанс, что краш >= 1.0, с "длинным хвостом"
  const r = Math.random();
  if (r < 0.03) return 1.0 + Math.random() * 0.2;      // мгновенный крах (3%)
  const raw = 0.92 / (1 - r);
  return Math.max(1.01, Math.floor(raw * 100) / 100);
}

function startRound() {
  const bet = Math.floor(Number(betInput.value) || 0);
  if (bet <= 0) return toast('Введи ставку', 'lose');
  if (bet > state.balance) return toast('Недостаточно звёзд', 'lose');

  state.bet = bet;
  state.balance -= bet;
  updateBalance();

  state.phase = 'flying';
  state.multiplier = 1.0;
  state.crashAt = generateCrashPoint();
  state.startTime = performance.now();
  state.rocketPos = { x: 0.15, y: 0.85 };
  state.particles = [];

  // UI
  betPanel.style.display = 'none';
  quickBets.style.display = 'none';
  cashoutInfo.textContent = `Ставка: ${bet} ⭐`;
  actionBtn.textContent = 'ЗАБРАТЬ';
  actionBtn.className = 'btn-action btn-cashout';
  actionBtn.disabled = false;

  rocket.style.display = 'block';
  flame.style.display = 'block';
  rocket.classList.add('rocket-flying');
  multiplierEl.style.display = 'block';
  multiplierEl.className = 'multiplier playing';
  multiplierEl.textContent = '1.00x';

  sfxStart();
  haptic('medium');

  resizeCanvas();
  state.rafId = requestAnimationFrame(loop);
}

function loop(now) {
  if (state.phase !== 'flying') return;

  const elapsed = (now - state.startTime) / 1000;

  // Рост множителя со временем (экспоненциальный)
  const m = Math.pow(1.0718, elapsed * 1.6);
  state.multiplier = m;

  // Краш?
  if (m >= state.crashAt) {
    state.multiplier = state.crashAt;
    return crash();
  }

  // Обновляем позицию ракеты (по параболе вверх-вправо)
  const t = Math.min(elapsed / 8, 1);
  state.rocketPos.x = 0.15 + t * 0.65;
  state.rocketPos.y = 0.85 - Math.pow(t, 0.7) * 0.65;

  // Рендер
  render(elapsed);
  updateMultiplierUI(m);

  // Тики звука
  const tickStep = Math.floor(m * 2);
  if (tickStep !== state._lastTick && m > 1.1) {
    state._lastTick = tickStep;
    sfxTick(Math.min(m, 10));
  }

  state.rafId = requestAnimationFrame(loop);
}

function render(elapsed) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);

  // ===== Траектория (пунктирная линия от старта до ракеты) =====
  ctx.save();
  const grad = ctx.createLinearGradient(0, h, w, 0);
  grad.addColorStop(0, 'rgba(0,212,255,0.05)');
  grad.addColorStop(1, 'rgba(0,255,136,0.6)');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 8]);
  ctx.lineDashOffset = -elapsed * 40;
  ctx.beginPath();
  ctx.moveTo(w * 0.15, h * 0.85);
  ctx.quadraticCurveTo(w * 0.4, h * 0.4, w * state.rocketPos.x, h * state.rocketPos.y);
  ctx.stroke();
  ctx.restore();

  // ===== Сетка на фоне =====
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  const step = 40;
  for (let x = 0; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
  for (let y = 0; y < h; y += step) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  ctx.restore();

  // ===== Ракета =====
  rocket.style.left = (state.rocketPos.x * 100) + '%';
  rocket.style.top = (state.rocketPos.y * 100) + '%';
  rocket.style.transform = 'translate(-50%,-50%)';
}

function updateMultiplierUI(m) {
  multiplierEl.textContent = m.toFixed(2) + 'x';

  // Меняем цвет по мере роста
  const hue = Math.max(0, 140 - (m - 1) * 20);
  multiplierEl.style.color = `hsl(${hue}, 100%, 60%)`;

  // Размер растёт
  const scale = Math.min(1 + (m - 1) * 0.05, 1.6);
  multiplierEl.style.transform = `translate(-50%,-50%) scale(${scale})`;

  // Инфа о возможном выигрыше
  const potential = Math.floor(state.bet * m);
  cashoutInfo.textContent = `Забрать: ${potential} ⭐ (+${potential - state.bet})`;
}

function crash() {
  state.phase = 'crashed';
  cancelAnimationFrame(state.rafId);
  sfxCrash();
  haptic('error');

  // Визуал
  rocket.classList.remove('rocket-flying');
  rocket.textContent = '💥';
  rocket.style.filter = 'drop-shadow(0 0 40px #ff2d55)';
  flame.style.display = 'none';
  multiplierEl.className = 'multiplier crashed';
  multiplierEl.textContent = state.crashAt.toFixed(2) + 'x';
  multiplierEl.style.transform = 'translate(-50%,-50%) scale(1)';

  // Вспышка
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 100);

  // Частицы
  spawnParticles();

  cashoutInfo.textContent = `💥 КРАХ на ${state.crashAt.toFixed(2)}x — ставка сгорела`;
  cashoutInfo.style.color = '#ff2d55';

  setTimeout(() => endRound(), 1800);
}

function cashout() {
  if (state.phase !== 'flying') return;
  state.phase = 'cashed';
  cancelAnimationFrame(state.rafId);
  sfxCashout();
  haptic('success');

  const win = Math.floor(state.bet * state.multiplier);
  const profit = win - state.bet;
  state.balance += win;
  updateBalance();

  rocket.classList.remove('rocket-flying');
  flame.style.display = 'none';
  rocket.textContent = '🏆';
  rocket.style.filter = 'drop-shadow(0 0 30px #00ff88)';
  multiplierEl.style.color = '#00ff88';

  cashoutInfo.textContent = `✅ Забрано ${win} ⭐ (+${profit})`;
  cashoutInfo.style.color = '#00ff88';
  toast(`+${win} ⭐`, 'win');

  spawnParticles('#00ff88');

  setTimeout(() => endRound(), 1400);
}

function spawnParticles(color) {
  const wrap = canvasWrap;
  const r = wrap.getBoundingClientRect();
  const cx = r.width * state.rocketPos.x;
  const cy = r.height * state.rocketPos.y;
  const colors = color ? [color] : ['#ff2d55','#ffb800','#ff6b00','#ffffff'];

  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.background = colors[i % colors.length];
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.boxShadow = `0 0 12px ${colors[i % colors.length]}`;
    wrap.appendChild(p);

    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 140;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;

    p.animate([
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`, opacity: 0 }
    ], { duration: 700 + Math.random() * 400, easing: 'cubic-bezier(0.2,0.8,0.4,1)' })
      .onfinish = () => p.remove();
  }
}

function endRound() {
  state.phase = 'idle';
  rocket.style.display = 'none';
  flame.style.display = 'none';
  rocket.textContent = '🚀';
  rocket.style.filter = 'drop-shadow(0 0 12px #00d4ff)';
  multiplierEl.style.display = 'none';
  multiplierEl.className = 'multiplier';
  multiplierEl.style.color = '';
  multiplierEl.style.transform = 'translate(-50%,-50%)';

  betPanel.style.display = 'flex';
  quickBets.style.display = 'flex';
  actionBtn.textContent = 'СТАРТ';
  actionBtn.className = 'btn-action btn-start';
  cashoutInfo.textContent = '';
  cashoutInfo.style.color = '#00ff88';

  if (state.balance <= 0) {
    state.balance = 0;
    updateBalance();
    toast('Баланс пуст — сбрось в меню', 'lose');
  }
}

/* ==================== ACTIONS ==================== */
function handleAction() {
  initAudio();
  if (state.phase === 'flying') cashout();
  else if (state.phase === 'idle') startRound();
}

function setBet(v) {
  haptic('light');
  if (v === 'all') betInput.value = Math.max(1, Math.floor(state.balance));
  else betInput.value = v;
}

function startGame() {
  initAudio();
  haptic('light');
  menuScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  betInput.value = Math.min(50, Math.max(1, Math.floor(state.balance)));
  updateBalance();
  resizeCanvas();
}

function exitGame() {
  if (state.phase === 'flying') cashout();
  cancelAnimationFrame(state.rafId);
  state.phase = 'idle';
  menuScreen.classList.remove('hidden');
  gameScreen.classList.add('hidden');
  updateBalance();
}

function resetBalance() {
  haptic('light');
  state.balance = 1000;
  updateBalance();
  toast('Баланс восстановлен', 'win');
}

/* ==================== INIT ==================== */
updateBalance();
if (tg?.initDataUnsafe?.user) {
  // Можешь использовать данные пользователя
  console.log('User:', tg.initDataUnsafe.user.first_name);
}
</script>
