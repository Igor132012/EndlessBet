<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EndlessBet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#000; color:#fff; user-select:none;
  }

  #space { position:fixed; inset:0; z-index:0; pointer-events:none; background:#000; }

  .screen {
    position:fixed; inset:0; display:flex; flex-direction:column;
    z-index:1; transition:opacity .25s; background:transparent;
  }
  .screen.hidden { opacity:0; pointer-events:none; }

  .ico {
    display:inline-block; width:1em; height:1em; vertical-align:-0.12em;
    flex-shrink:0; line-height:1;
  }
  .ico svg { width:100%; height:100%; display:block; }

  /* Меню */
  #menu { align-items:center; justify-content:center; padding:28px; text-align:center; }
  .brand {
    font-size:11px; color:#2a6a3a; letter-spacing:6px; text-transform:uppercase;
    margin-bottom:52px; font-weight:500;
  }
  .balance-block { margin-bottom:64px; }
  .balance-label {
    font-size:10px; color:#1a5a2a; letter-spacing:4px; text-transform:uppercase;
    margin-bottom:14px;
  }
  .balance-value {
    font-size:58px; font-weight:200; letter-spacing:-2px;
    color:#5cff9a; font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .balance-value .ico { font-size:42px; color:#5cff9a; opacity:.85; }

  .modes { display:flex; flex-direction:column; gap:12px; width:100%; max-width:320px; }
  .mode-btn {
    border:1px solid #0a3a1a; background:#000;
    border-radius:16px;
    padding:22px 26px; color:#fff; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    transition:border-color .25s, background .25s; font-family:inherit;
    font-size:15px; letter-spacing:1px;
  }
  .mode-btn:active { background:#031a0a; border-color:#0a8040; }
  .mode-btn .label { font-weight:500; color:#5cff9a; }
  .mode-btn .sub { color:#1a5a2a; font-size:11px; margin-top:4px; letter-spacing:0; }

  .menu-footer { margin-top:44px; display:flex; gap:10px; }
  .mini-btn {
    background:transparent; border:1px solid #0a3a1a; color:#2a6a3a;
    font-size:12px; letter-spacing:1.5px; cursor:pointer;
    font-family:inherit; padding:12px 22px; border-radius:12px;
    transition:all .2s;
  }
  .mini-btn:active { border-color:#0a8040; color:#5cff9a; }

  /* Топбар */
  .topbar {
    padding:20px 24px; display:flex; justify-content:space-between; align-items:center;
  }
  .close-btn {
    background:transparent; border:none; color:#2a6a3a;
    cursor:pointer; padding:8px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:color .2s;
  }
  .close-btn:active { color:#5cff9a; }
  .close-btn .ico { font-size:20px; }
  .topbar-balance {
    color:#5cff9a; font-size:15px; font-variant-numeric:tabular-nums;
    display:flex; align-items:center; gap:6px; font-weight:300;
  }
  .topbar-balance .ico { font-size:14px; color:#5cff9a; }

  /* КРАШ */
  .crash-stage {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; position:relative;
  }
  .crash-x {
    font-size:118px; font-weight:100; letter-spacing:-5px;
    color:#fff; font-variant-numeric:tabular-nums;
    line-height:1;
    transition:color .15s ease, opacity .5s ease, transform .5s cubic-bezier(0.4,0,0.2,1);
  }
  .crash-x.crashed {
    color:#ff4d4d;
    animation:crashShake .5s ease-out;
  }
  @keyframes crashShake {
    0%,100% { transform:translateX(0); }
    20% { transform:translateX(-8px); }
    40% { transform:translateX(8px); }
    60% { transform:translateX(-5px); }
    80% { transform:translateX(5px); }
  }
  .crash-x.hidden {
    opacity:0; transform:translateY(-30px) scale(0.9); pointer-events:none;
  }
  .crash-label {
    position:absolute;
    font-size:82px; font-weight:200; letter-spacing:8px;
    color:#ff4d4d; opacity:0;
    transform:translateY(40px) scale(0.85);
    transition:opacity .5s ease .15s, transform .5s cubic-bezier(0.34,1.56,0.64,1) .15s;
  }
  .crash-label.show { opacity:1; transform:translateY(0) scale(1); }

  .crash-caption {
    margin-top:24px; font-size:11px; color:#2a5a3a; letter-spacing:3px;
    text-transform:uppercase; transition:opacity .3s;
  }
  .crash-caption.hidden { opacity:0; }

  .crash-controls { padding:0 24px 34px; }
  .crash-info {
    text-align:center; font-size:14px; color:#3a7a4a;
    margin-bottom:16px; height:22px; letter-spacing:.5px;
    display:flex; align-items:center; justify-content:center; gap:5px;
    font-weight:300;
  }
  .crash-info.active { color:#5cff9a; }
  .crash-info .ico { font-size:14px; }

  .bet-row {
    display:flex; align-items:center;
    border:1px solid #0a3a1a; background:#000;
    border-radius:16px; padding:0 20px; margin-bottom:12px;
    transition:border-color .2s;
  }
  .bet-row:focus-within { border-color:#0a8040; }
  #betInput {
    flex:1; min-width:0; background:none; border:none; color:#5cff9a;
    font-size:22px; font-weight:300; padding:20px 0; outline:none;
    width:100%; font-family:inherit; font-variant-numeric:tabular-nums;
  }
  #betInput::placeholder { color:#1a4a2a; }
  .bet-row .unit {
    color:#3a7a4a; font-size:14px;
    display:flex; align-items:center; gap:5px;
    flex-shrink:0;
  }
  .bet-row .unit .ico { font-size:16px; color:#5cff9a; }

  .quick-row { display:flex; gap:8px; margin-bottom:12px; }
  .quick-btn {
    flex:1; background:#000; border:1px solid #0a3a1a;
    color:#3a7a4a; padding:12px; border-radius:12px; font-size:13px;
    cursor:pointer; transition:all .15s; font-family:inherit;
    font-variant-numeric:tabular-nums;
  }
  .quick-btn:active { border-color:#0a8040; color:#5cff9a; }

  .main-btn {
    width:100%; background:#000; border:1px solid #0a8040;
    border-radius:16px; padding:22px; color:#5cff9a;
    font-size:14px; font-weight:500; letter-spacing:3px;
    cursor:pointer; transition:background .2s, border-color .2s;
    font-family:inherit; text-transform:uppercase;
  }
  .main-btn:active:not(.disabled):not(:disabled) {
    background:#031a0a; border-color:#5cff9a;
  }
  .main-btn.cashout { color:#000; background:#5cff9a; border-color:#5cff9a; }

  .main-btn:disabled,
  .main-btn.disabled {
    color:#1a4a2a !important;
    border-color:#0a2a15 !important;
    background:#000 !important;
    cursor:not-allowed !important;
    letter-spacing:2px;
    pointer-events:none;
  }
  .main-btn.disabled:active,
  .main-btn:disabled:active {
    background:#000 !important;
    border-color:#0a2a15 !important;
  }

  /* КЕЙСЫ */
  .cases-list {
    flex:1; padding:0 24px; display:flex; flex-direction:column;
    justify-content:center; gap:12px;
  }
  .case-item {
    border:1px solid #0a3a1a; background:#000;
    border-radius:16px;
    padding:22px 26px; color:#fff; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    transition:border-color .2s; font-family:inherit; text-align:left;
  }
  .case-item:active { border-color:#0a8040; }
  .case-item .info .name { font-size:15px; letter-spacing:1px; font-weight:500; color:#5cff9a; }
  .case-item .info .range {
    color:#3a7a4a; font-size:11px; margin-top:5px;
    display:flex; align-items:center; gap:3px;
  }
  .case-item .info .range .ico { font-size:10px; }
  .case-item .price {
    font-size:15px; color:#5cff9a; font-variant-numeric:tabular-nums;
    letter-spacing:1px; display:flex; align-items:center; gap:5px;
    flex-shrink:0;
  }
  .case-item .price .ico { font-size:14px; }
  .case-item.case-sub { border-color:#0a8040; }

  /* РУЛЕТКА */
  .roulette-stage {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .roulette { position:relative; width:100%; height:110px; overflow:hidden; }
  .roulette::before, .roulette::after {
    content:""; position:absolute; top:0; bottom:0; width:80px; z-index:4;
    pointer-events:none;
  }
  .roulette::before { left:0; background:linear-gradient(to right, #000 10%, transparent); }
  .roulette::after { right:0; background:linear-gradient(to left, #000 10%, transparent); }

  .track {
    position:absolute; top:0; left:0; height:100%;
    display:flex; align-items:center; will-change:transform;
  }
  .slot {
    width:80px; height:90px; margin:0 5px; flex-shrink:0;
    border:1px solid #0a3a1a; border-radius:12px;
    display:flex; align-items:center; justify-content:center; gap:4px;
    font-size:16px; font-weight:300; color:#3a7a4a;
    font-variant-numeric:tabular-nums;
    transition:border-color .3s, color .3s;
    background:#000;
  }
  .slot .ico { font-size:12px; }
  .slot.rare    { color:#7affaa; border-color:#0a5a2a; }
  .slot.epic    { color:#aaffcc; border-color:#0a8040; }
  .slot.legend  { color:#5cff9a; border-color:#5cff9a; }

  .pointer {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:2px; height:120px; background:#5cff9a; z-index:5;
    border-radius:1px;
  }
  .spin-result {
    text-align:center; margin-top:40px;
    opacity:0; transition:opacity .3s;
  }
  .spin-result.show { opacity:1; }
  .spin-result .label {
    font-size:10px; color:#3a7a4a; letter-spacing:4px; text-transform:uppercase;
    margin-bottom:10px;
  }
  .spin-result .val {
    font-size:48px; font-weight:200; letter-spacing:-1px;
    color:#5cff9a; font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .spin-result .val .ico { font-size:28px; }

  .spin-controls { padding:0 24px 34px; }

  /* ПРОФИЛЬ */
  .profile-content { flex:1; padding:0 24px; overflow-y:auto; }
  .profile-card {
    border:1px solid #0a3a1a; background:#000;
    border-radius:18px;
    padding:26px; margin-bottom:18px;
    display:flex; align-items:center; gap:18px;
  }
  .profile-avatar {
    width:62px; height:62px; border-radius:50%;
    border:1px solid #0a5a2a; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:#5cff9a; background:#000;
    overflow:hidden;
  }
  .profile-avatar img { width:100%; height:100%; object-fit:cover; }
  .profile-avatar .ico { font-size:30px; }
  .profile-info .name { font-size:18px; font-weight:400; color:#5cff9a; }
  .profile-info .username { color:#3a7a4a; font-size:13px; margin-top:4px; }

  .stats-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px;
  }
  .stat-card {
    border:1px solid #0a3a1a; background:#000;
    border-radius:14px; padding:20px 16px; text-align:center;
  }
  .stat-card .stat-label {
    font-size:10px; color:#2a5a3a; letter-spacing:3px; text-transform:uppercase;
    margin-bottom:10px;
  }
  .stat-card .stat-value {
    font-size:22px; font-weight:300; color:#5cff9a;
    font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .stat-card .stat-value .ico { font-size:16px; }

  .section-title {
    font-size:10px; color:#2a5a3a; letter-spacing:4px; text-transform:uppercase;
    margin:22px 0 12px;
  }

  .promo-row { display:flex; gap:10px; }
  .promo-input {
    flex:1; min-width:0; background:#000; border:1px solid #0a3a1a;
    border-radius:12px; padding:18px; color:#5cff9a;
    font-size:14px; outline:none; font-family:inherit;
    letter-spacing:1px;
  }
  .promo-input::placeholder { color:#1a4a2a; }
  .promo-input:focus { border-color:#0a8040; }
  .promo-btn {
    background:#000; border:1px solid #0a8040;
    border-radius:12px; padding:0 24px; color:#5cff9a;
    font-size:13px; cursor:pointer; font-family:inherit;
    letter-spacing:1.5px; transition:all .2s;
    flex-shrink:0;
  }
  .promo-btn:active { background:#031a0a; border-color:#5cff9a; }

  .pay-row { display:flex; gap:12px; margin-bottom:12px; }
  .pay-btn {
    flex:1; min-width:0; background:#000; border:1px solid #0a3a1a;
    border-radius:16px; padding:20px 16px; color:#5cff9a;
    cursor:pointer; font-family:inherit; font-size:13px;
    letter-spacing:1px; transition:all .2s;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .pay-btn:active { border-color:#0a8040; }
  .pay-btn .pay-icon { display:flex; align-items:center; justify-content:center; color:#5cff9a; }
  .pay-btn .pay-icon .ico { font-size:28px; }
  .pay-btn .pay-label { font-weight:400; }
  .pay-btn .pay-sub { font-size:10px; color:#3a7a4a; }

  #toast {
    position:fixed; top:60px; left:50%;
    transform:translateX(-50%) translateY(-40px);
    background:#000; color:#5cff9a;
    padding:14px 24px; border-radius:100px;
    font-size:14px; z-index:100;
    border:1px solid #0a8040;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s;
    pointer-events:none; white-space:nowrap; opacity:0;
    letter-spacing:.5px;
    display:flex; align-items:center; gap:6px;
  }
  #toast .ico { font-size:13px; }
  #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

  .modal-bg {
    position:fixed; inset:0; background:rgba(0,0,0,0.9);
    z-index:200; display:none; align-items:center; justify-content:center;
    padding:24px;
  }
  .modal-card {
    width:100%; max-width:340px;
    border:1px solid #0a8040; background:#000;
    border-radius:20px; padding:26px;
  }
  .modal-title { text-align:center; margin-bottom:22px; }
  .modal-title .t1 {
    font-size:10px; color:#2a6a3a; letter-spacing:4px; text-transform:uppercase;
  }
  .modal-title .t2 {
    font-size:16px; color:#5cff9a; margin-top:10px; font-weight:400;
  }
  .pack-btn {
    background:#000; border:1px solid #0a8040; border-radius:14px;
    padding:18px 20px; color:#5cff9a; font-family:inherit;
    font-size:15px; letter-spacing:1px; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    width:100%; margin-bottom:10px; transition:all .2s;
  }
  .pack-btn:active { background:#031a0a; border-color:#5cff9a; }
  .pack-btn .left { display:flex; align-items:center; gap:8px; }
  .pack-btn .left .ico { font-size:16px; }
  .pack-btn .right { color:#3a7a4a; font-size:12px; }

  .custom-row {
    display:flex; gap:8px; margin-top:12px; margin-bottom:10px;
    align-items:stretch;
  }
  .custom-input {
    flex:1; min-width:0;
    background:#000; border:1px solid #0a3a1a;
    border-radius:12px; padding:16px; color:#5cff9a;
    font-size:15px; outline:none; font-family:inherit;
    font-variant-numeric:tabular-nums;
  }
  .custom-input::placeholder { color:#1a4a2a; }
  .custom-input:focus { border-color:#0a8040; }
  .custom-btn {
    background:#000; border:1px solid #0a8040;
    border-radius:12px; padding:0 22px; color:#5cff9a;
    font-size:14px; cursor:pointer; font-family:inherit;
    letter-spacing:1px; transition:all .2s;
    flex-shrink:0; min-width:64px; white-space:nowrap;
    line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .custom-btn:active { background:#031a0a; border-color:#5cff9a; }

  .modal-close {
    width:100%; margin-top:12px; background:transparent;
    border:1px solid #0a3a1a; color:#3a7a4a;
    border-radius:12px; padding:14px; font-size:13px;
    font-family:inherit; letter-spacing:1.5px; cursor:pointer;
  }
  .modal-close:active { border-color:#0a8040; color:#5cff9a; }
</style>
</head>
<body>

<div id="space"></div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div class="screen" id="menu">
  <div class="brand">Endless</div>

  <div class="balance-block">
    <div class="balance-label">Баланс</div>
    <div class="balance-value" id="menuBalance"></div>
  </div>

  <div class="modes">
    <button class="mode-btn" onclick="openMode('crash')">
      <div>
        <div class="label">Краш</div>
        <div class="sub">Успей забрать</div>
      </div>
    </button>
    <button class="mode-btn" onclick="openMode('cases')">
      <div>
        <div class="label">Кейсы</div>
        <div class="sub">Испытай удачу</div>
      </div>
    </button>
  </div>

  <div class="menu-footer">
    <button class="mini-btn" onclick="openProfile()">профиль</button>
  </div>
</div>

<!-- КРАШ -->
<div class="screen hidden" id="crash">
  <div class="topbar">
    <button class="close-btn" onclick="backToMenu()">
      <span class="ico" data-icon="close"></span>
    </button>
    <div class="topbar-balance" id="crashBalance"></div>
  </div>

  <div class="crash-stage">
    <div class="crash-x" id="multiplier">1.00x</div>
    <div class="crash-label" id="crashLabel">КРАШ</div>
    <div class="crash-caption" id="crashCaption">нажми старт</div>
  </div>

  <div class="crash-controls">
    <div class="crash-info" id="crashInfo"></div>
    <div class="bet-row">
      <input type="number" id="betInput" placeholder="0" value="50" min="1">
      <span class="unit"></span>
    </div>
    <div class="quick-row" id="quickRow">
      <button class="quick-btn" onclick="setBet(10)">10</button>
      <button class="quick-btn" onclick="setBet(50)">50</button>
      <button class="quick-btn" onclick="setBet(100)">100</button>
      <button class="quick-btn" onclick="setBet(500)">500</button>
      <button class="quick-btn" onclick="setBet('all')">max</button>
    </div>
    <button class="main-btn" id="actionBtn" onclick="handleCrashAction()">Старт</button>
  </div>
</div>

<!-- ВЫБОР КЕЙСА -->
<div class="screen hidden" id="cases">
  <div class="topbar">
    <button class="close-btn" onclick="backToMenu()">
      <span class="ico" data-icon="close"></span>
    </button>
    <div class="topbar-balance" id="casesBalance"></div>
  </div>

  <div class="cases-list">
    <button class="case-item case-sub" onclick="openCaseScreen('subcase')">
      <div class="info">
        <div class="name">За подписку</div>
        <div class="range">1 <span class="ico" data-icon="star"></span> — 10 000 <span class="ico" data-icon="star"></span></div>
      </div>
      <div class="price" id="subcaseLabel">Бесплатно</div>
    </button>

    <button class="case-item" onclick="openCaseScreen('case10')">
      <div class="info">
        <div class="name">Обычный</div>
        <div class="range">1 <span class="ico" data-icon="star"></span> — 1 000 <span class="ico" data-icon="star"></span></div>
      </div>
      <div class="price" id="case10Label">10 <span class="ico" data-icon="star"></span></div>
    </button>

    <button class="case-item" onclick="openCaseScreen('case50')">
      <div class="info">
        <div class="name">Редкий</div>
        <div class="range">5 <span class="ico" data-icon="star"></span> — 2 000 <span class="ico" data-icon="star"></span></div>
      </div>
      <div class="price" id="case50Label">50 <span class="ico" data-icon="star"></span></div>
    </button>

    <button class="case-item" onclick="openCaseScreen('case100')">
      <div class="info">
        <div class="name">Легендарный</div>
        <div class="range">10 <span class="ico" data-icon="star"></span> — 5 000 <span class="ico" data-icon="star"></span></div>
      </div>
      <div class="price" id="case100Label">100 <span class="ico" data-icon="star"></span></div>
    </button>
  </div>
</div>

<!-- ОТКРЫТИЕ КЕЙСА -->
<div class="screen hidden" id="caseOpen">
  <div class="topbar">
    <button class="close-btn" onclick="closeCase()">
      <span class="ico" data-icon="close"></span>
    </button>
    <div class="topbar-balance" id="openBalance"></div>
  </div>

  <div class="roulette-stage">
    <div class="roulette">
      <div class="track" id="track"></div>
      <div class="pointer"></div>
    </div>

    <div class="spin-result" id="spinResult">
      <div class="label">Выпало</div>
      <div class="val" id="spinValue"></div>
    </div>
  </div>

  <div class="spin-controls">
    <button class="main-btn" id="spinBtn" onclick="mainCaseAction()">Купить</button>
  </div>
</div>

<!-- ПРОФИЛЬ -->

<script>
/* ==================== TELEGRAM ==================== */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ==================== API ==================== */
const API_URL = 'https://endlessbet.i-makarov2012.workers.dev';

async function apiCall(path, body) {
  const r = await fetch(API_URL + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'API error');
  return data;
}

async function apiGet(path) {
  const r = await fetch(API_URL + path);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'API error');
  return data;
}

function getUserId() {
  return tg?.initDataUnsafe?.user?.id || null;
}

/* ==================== SVG ИКОНКИ ==================== */
const ICONS = {
  star: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M12 2.5 L14.6 9.3 L21.5 9.7 L16.1 14.2 L17.9 21 L12 17.2 L6.1 21 L7.9 14.2 L2.5 9.7 L9.4 9.3 Z"/>
  </svg>`,
  user: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
  </svg>`,
  close: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 6 L18 18"/>
    <path d="M18 6 L6 18"/>
  </svg>`,
};

function renderIcons(root = document) {
  root.querySelectorAll('.ico[data-icon]').forEach(el => {
    const key = el.dataset.icon;
    if (ICONS[key]) el.innerHTML = ICONS[key];
  });
}

/* ==================== СОСТОЯНИЕ ==================== */
const state = {
  balance: 0,
  withdrawable: 0,
  inventory: {},
  crashPhase: 'idle',
  crashMultiplier: 1.0,
  crashAt: 2.0,
  crashStart: 0,
  crashBet: 0,
  crashRaf: null,
  busyCrash: false,
  busyCase: false,
  busySpin: false,
  idleSpinRaf: null,
  currentCase: null,
  // Подписочный кейс
  subcaseSubscribed: false,
  subcaseCanOpen: false,
  subcaseNextAt: 0,
  subcaseTimerRaf: null,
};

const $ = id => document.getElementById(id);

/* ==================== ЗВУК ==================== */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function initAudio() { if (!actx) actx = new AudioCtx(); if (actx.state === 'suspended') actx.resume(); }

function tone(freq, dur, type='sine', vol=0.05) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}

function popSound() {
  if (!actx) return;
  const now = actx.currentTime;

  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(900, now);
  o.frequency.exponentialRampToValueAtTime(200, now + 0.035);
  g.gain.setValueAtTime(0.08, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
  o.connect(g); g.connect(actx.destination);
  o.start(now); o.stop(now + 0.05);

  const o2 = actx.createOscillator();
  const g2 = actx.createGain();
  o2.type = 'square';
  o2.frequency.setValueAtTime(1500, now);
  g2.gain.setValueAtTime(0.03, now);
  g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.02);
  o2.connect(g2); g2.connect(actx.destination);
  o2.start(now); o2.stop(now + 0.025);
}

function haptic(type) {
  if (!tg?.HapticFeedback) return;
  if (type === 'light')   tg.HapticFeedback.impactOccurred('light');
  if (type === 'medium')  tg.HapticFeedback.impactOccurred('medium');
  if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
  if (type === 'error')   tg.HapticFeedback.notificationOccurred('error');
}

/* ==================== UI ==================== */
function fmt(n) { return Math.floor(n).toLocaleString('ru-RU'); }
function starIco() { return `<span class="ico" data-icon="star">${ICONS.star}</span>`; }

function updateBalance() {
  $('menuBalance').innerHTML = `<span class="num">${fmt(state.balance)}</span>${starIco()}`;
  const h = starIco() + '<span class="num">' + fmt(state.balance) + '</span>';
  $('crashBalance').innerHTML = h;
  $('casesBalance').innerHTML = h;
  $('openBalance').innerHTML = h;
  $('profileBalance').innerHTML = h;
}

function updateProfileBalance() {
  $('statBalance').innerHTML = fmt(state.balance) + starIco();
  $('statWithdrawable').innerHTML = fmt(state.withdrawable) + starIco();
}

function updateCaseLabels() {
  const map = { case10: 'case10Label', case50: 'case50Label', case100: 'case100Label' };
  const prices = { case10: 10, case50: 50, case100: 100 };
  for (const key in map) {
    const cnt = state.inventory[key] || 0;
    const el = $(map[key]);
    if (!el) continue;
    if (cnt > 0) el.innerHTML = `${cnt} шт.`;
    else el.innerHTML = `${prices[key]} ${starIco()}`;
  }
}

function toastDelta(amount) {
  const t = $('toast');
  const sign = amount >= 0 ? '+' : '−';
  t.innerHTML = `<span>${sign}${fmt(Math.abs(amount))}</span>${starIco()}`;
  t.className = 'show';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = '', 1600);
}
function toastText(msg) {
  const t = $('toast');
  t.innerHTML = `<span>${msg}</span>`;
  t.className = 'show';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = '', 1600);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  $(id).classList.remove('hidden');
}

/* ==================== API-ОБЁРТКИ ==================== */
async function syncBalance() {
  const uid = getUserId();
  if (!uid) return;
  try {
    const d = await apiCall('/api/balance', { user_id: uid });
    state.balance = d.balance || 0;
    state.withdrawable = d.withdrawable || 0;
    updateBalance(); updateProfileBalance();
  } catch (e) { console.warn('syncBalance:', e); }
}

async function syncInventory() {
  const uid = getUserId();
  if (!uid) return;
  try {
    const inv = await apiGet('/api/inventory?user_id=' + uid);
    state.inventory = inv || {};
    updateCaseLabels();
  } catch (e) { console.warn('syncInventory:', e); }
}

async function checkSubcaseStatus() {
  const uid = getUserId();
  if (!uid) return;
  try {
    const d = await apiCall('/api/sub-case/status', { user_id: uid });
    state.subcaseSubscribed = d.subscribed;
    state.subcaseCanOpen = d.can_open;
    state.subcaseNextAt = d.next_at || 0;
  } catch (e) {
    console.warn('checkSubcaseStatus:', e);
  }
}

async function openSubcaseForReal() {
  const uid = getUserId();
  if (!uid) return false;
  try {
    await apiCall('/api/sub-case/open', { user_id: uid });
    return true;
  } catch (e) {
    toastText(e.message);
    return false;
  }
}

function formatTimer(ms) {
  if (ms < 0) ms = 0;
  const total = Math.floor(ms / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return String(h).padStart(2, '0') + ':' +
         String(m).padStart(2, '0') + ':' +
         String(s).padStart(2, '0');
}

async function spendAPI(amount) {
  const uid = getUserId();
  if (!uid) { toastText('Открой из Telegram'); return false; }
  try {
    const d = await apiCall('/api/balance/change', { user_id: uid, amount: -amount });
    state.balance = d.balance;
    state.withdrawable = d.withdrawable;
    updateBalance(); updateProfileBalance();
    return true;
  } catch (e) {
    toastText(e.message);
    setTimeout(syncBalance, 100);
    return false;
  }
}

async function winAPI(amount) {
  const uid = getUserId();
  if (!uid) return;
  try {
    const d = await apiCall('/api/balance/win', { user_id: uid, amount });
    state.balance = d.balance;
    state.withdrawable = d.withdrawable;
    updateBalance(); updateProfileBalance();
  } catch (e) { console.warn(e); }
}

async function inventoryAdd(caseKey) {
  const uid = getUserId();
  if (!uid) return;
  try {
    await apiCall('/api/inventory/add', { user_id: uid, case_key: caseKey });
    state.inventory[caseKey] = (state.inventory[caseKey] || 0) + 1;
    updateCaseLabels();
  } catch (e) { console.warn(e); }
}

async function inventorySpend(caseKey) {
  const uid = getUserId();
  if (!uid) return false;
  try {
    const d = await apiCall('/api/inventory/spend', { user_id: uid, case_key: caseKey });
    state.inventory[caseKey] = d.count;
    updateCaseLabels();
    return true;
  } catch (e) { console.warn(e); return false; }
}

/* ==================== НАВИГАЦИЯ ==================== */
function openMode(mode) {
  initAudio(); haptic('light');
  if (mode === 'crash') {
    showScreen('crash');
    $('betInput').value = Math.min(50, Math.max(1, Math.floor(state.balance)));
  } else {
    showScreen('cases');
    syncInventory();
  }
  updateBalance();
}
function backToMenu() {
  haptic('light');
  if (state.crashPhase === 'flying') cashoutCrash();
  cancelAnimationFrame(state.crashRaf);
  state.crashPhase = 'idle';
  stopIdleSpin();
  stopSubcaseTimer();
  showScreen('menu');
  updateBalance(); updateProfileBalance();
}
function closeCase() {
  haptic('light');
  if (state.busySpin || state.busyCase) return;
  stopIdleSpin();
  stopSubcaseTimer();
  showScreen('cases');
  updateBalance();
}
function openProfile() {
  initAudio(); haptic('light');
  const user = tg?.initDataUnsafe?.user;
  const av = $('avatar');
  if (user) {
    $('userName').textContent = [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Без имени';
    $('userUsername').textContent = user.username ? '@' + user.username : '—';
    if (user.photo_url) av.innerHTML = `<img src="${user.photo_url}" alt="">`;
    else av.innerHTML = `<span class="ico">${ICONS.user}</span>`;
  } else {
    av.innerHTML = `<span class="ico">${ICONS.user}</span>`;
  }
  updateProfileBalance(); updateBalance();
  showScreen('profile');
}

/* ==================== КРАШ ==================== */
function generateCrashPoint() {
  const r = Math.random();
  if (r < 0.03) return 1.0 + Math.random() * 0.2;
  const raw = 0.92 / (1 - r);
  return Math.max(1.01, Math.floor(raw * 100) / 100);
}

async function startCrashRound() {
  if (state.busyCrash) return;
  const bet = Math.floor(Number($('betInput').value) || 0);
  if (bet <= 0) return toastText('Введи ставку');
  if (bet > state.balance) return toastText('Недостаточно звёзд');

  state.busyCrash = true;
  const ok = await spendAPI(bet);
  state.busyCrash = false;

  if (!ok) return;

  toastDelta(-bet);
  state.crashBet = bet;
  state.crashPhase = 'flying';
  state.crashMultiplier = 1.0;
  state.crashAt = generateCrashPoint();
  state.crashStart = performance.now();

  $('quickRow').style.display = 'none';
  $('betInput').parentElement.style.display = 'none';
  $('actionBtn').textContent = 'Забрать';
  $('actionBtn').className = 'main-btn cashout';
  $('actionBtn').disabled = false;
  $('crashCaption').textContent = `ставка ${fmt(bet)}`;
  $('crashCaption').classList.remove('hidden');
  $('crashLabel').classList.remove('show');

  const el = $('multiplier');
  el.classList.remove('hidden', 'crashed');
  el.style.color = '#fff';
  el.textContent = '1.00x';

  initAudio(); tone(220, 0.08, 'sine');
  haptic('medium');
  state.crashRaf = requestAnimationFrame(crashLoop);
}

function crashLoop(now) {
  if (state.crashPhase !== 'flying') return;
  const elapsed = (now - state.crashStart) / 1000;
  const m = Math.pow(1.0718, elapsed * 1.6);
  state.crashMultiplier = m;

  if (m >= state.crashAt) {
    state.crashMultiplier = state.crashAt;
    return crashBoom();
  }

  const el = $('multiplier');
  el.textContent = m.toFixed(2) + 'x';
  el.style.color = '#fff';

  const potential = Math.floor(state.crashBet * m);
  $('crashInfo').innerHTML = fmt(potential) + ' ' + starIco();
  $('crashInfo').className = 'crash-info active';

  state.crashRaf = requestAnimationFrame(crashLoop);
}

function crashBoom() {
  state.crashPhase = 'crashed';
  cancelAnimationFrame(state.crashRaf);
  tone(200, 0.5, 'sawtooth', 0.1);
  haptic('error');

  const el = $('multiplier');
  el.className = 'crash-x crashed';
  el.textContent = state.crashAt.toFixed(2) + 'x';

  $('crashCaption').classList.add('hidden');
  $('crashInfo').innerHTML = '';
  $('crashInfo').className = 'crash-info';

  setTimeout(() => {
    el.classList.add('hidden');
    $('crashLabel').classList.add('show');
  }, 900);

  setTimeout(() => endCrashRound(), 2400);
}

async function cashoutCrash() {
  if (state.crashPhase !== 'flying') return;
  state.crashPhase = 'cashed';
  cancelAnimationFrame(state.crashRaf);
  tone(660, 0.1); setTimeout(()=>tone(880, 0.15), 80);
  haptic('success');

  const win = Math.floor(state.crashBet * state.crashMultiplier);

  await winAPI(win);

  $('multiplier').style.color = '#5cff9a';
  $('crashCaption').textContent = `забрано`;
  $('crashCaption').classList.remove('hidden');
  $('crashInfo').innerHTML = '';
  $('crashInfo').className = 'crash-info';
  toastDelta(win);

  setTimeout(() => endCrashRound(), 1200);
}

function endCrashRound() {
  state.crashPhase = 'idle';
  const el = $('multiplier');
  el.textContent = '1.00x';
  el.className = 'crash-x';
  el.style.color = '#fff';
  $('crashLabel').classList.remove('show');
  $('crashCaption').textContent = 'нажми старт';
  $('crashCaption').classList.remove('hidden');
  $('quickRow').style.display = 'flex';
  $('betInput').parentElement.style.display = 'flex';
  $('actionBtn').textContent = 'Старт';
  $('actionBtn').className = 'main-btn';
  $('crashInfo').innerHTML = '';
  $('crashInfo').className = 'crash-info';
}

function handleCrashAction() {
  initAudio();
  if (state.crashPhase === 'flying') cashoutCrash();
  else if (state.crashPhase === 'idle') startCrashRound();
}
function setBet(v) {
  haptic('light');
  if (v === 'all') $('betInput').value = Math.max(1, Math.floor(state.balance));
  else $('betInput').value = v;
}

/* ==================== КЕЙСЫ (уменьшенные шансы) ==================== */
const CASES = {
  case10: {
    price: 10, min: 1, max: 1000,
    prizes: [
      { prize: 1,    weight: 4500 },
      { prize: 2,    weight: 3000 },
      { prize: 5,    weight: 1500 },
      { prize: 10,   weight: 800 },
      { prize: 25,   weight: 150 },
      { prize: 50,   weight: 40 },
      { prize: 100,  weight: 8 },
      { prize: 250,  weight: 1.8 },
      { prize: 500,  weight: 0.18 },
      { prize: 1000, weight: 0.02 },
    ]
  },
  case50: {
    price: 50, min: 5, max: 2000,
    prizes: [
      { prize: 5,    weight: 4500 },
      { prize: 15,   weight: 3000 },
      { prize: 30,   weight: 1500 },
      { prize: 60,   weight: 800 },
      { prize: 100,  weight: 150 },
      { prize: 200,  weight: 40 },
      { prize: 400,  weight: 8 },
      { prize: 700,  weight: 1.8 },
      { prize: 1200, weight: 0.18 },
      { prize: 2000, weight: 0.02 },
    ]
  },
  case100: {
    price: 100, min: 10, max: 5000,
    prizes: [
      { prize: 10,   weight: 4500 },
      { prize: 30,   weight: 3000 },
      { prize: 70,   weight: 1500 },
      { prize: 150,  weight: 800 },
      { prize: 300,  weight: 150 },
      { prize: 600,  weight: 40 },
      { prize: 1000, weight: 8 },
      { prize: 2000, weight: 1.8 },
      { prize: 3500, weight: 0.18 },
      { prize: 5000, weight: 0.02 },
    ]
  },
  subcase: {
    price: 0, min: 1, max: 10000,
    prizes: [
      { prize: 5,     weight: 4500 },
      { prize: 15,    weight: 3000 },
      { prize: 50,    weight: 1500 },
      { prize: 100,   weight: 800 },
      { prize: 300,   weight: 150 },
      { prize: 700,   weight: 40 },
      { prize: 1500,  weight: 8 },
      { prize: 3000,  weight: 1.8 },
      { prize: 6000,  weight: 0.18 },
      { prize: 10000, weight: 0.02 },
    ]
  }
};

function pickPrize(caseKey) {
  const c = CASES[caseKey];
  const total = c.prizes.reduce((s, p) => s + p.weight, 0);
  let r = Math.random() * total;
  for (const p of c.prizes) {
    r -= p.weight;
    if (r <= 0) return p.prize;
  }
  return c.prizes[0].prize;
}

function tierOf(prize, c) {
  const ratio = (prize - c.min) / (c.max - c.min);
  if (ratio >= 0.85) return 'legend';
  if (ratio >= 0.6)  return 'epic';
  if (ratio >= 0.35) return 'rare';
  return '';
}

function makeSlot(prize, c) {
  const el = document.createElement('div');
  const tier = tierOf(prize, c);
  el.className = 'slot' + (tier ? ' ' + tier : '');
  el.innerHTML = `<span>${prize}</span>${starIco()}`;
  return el;
}

const TRACK_SIZE = 60;
const STOP_INDEX = 50;

function startIdleSpin(caseKey) {
  stopIdleSpin();
  const c = CASES[caseKey];
  const track = $('track');
  track.innerHTML = '';
  for (let i = 0; i < 60; i++) {
    const prize = c.prizes[Math.floor(Math.random() * c.prizes.length)].prize;
    track.appendChild(makeSlot(prize, c));
  }
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';

  let pos = 0;
  let last = performance.now();
  function frame(now) {
    const dt = now - last;
    last = now;
    pos -= dt * 0.04;
    if (pos < -60 * 90) pos += 60 * 90;
    track.style.transform = `translateX(${pos}px)`;
    state.idleSpinRaf = requestAnimationFrame(frame);
  }
  state.idleSpinRaf = requestAnimationFrame(frame);
}
function stopIdleSpin() {
  if (state.idleSpinRaf) {
    cancelAnimationFrame(state.idleSpinRaf);
    state.idleSpinRaf = null;
  }
}

function lockSpinBtn(text) {
  const btn = $('spinBtn');
  btn.disabled = true;
  btn.classList.add('disabled');
  btn.textContent = text;
}
function unlockSpinBtn(text) {
  const btn = $('spinBtn');
  btn.disabled = false;
  btn.classList.remove('disabled');
  btn.textContent = text;
}

function openCaseScreen(caseKey) {
  initAudio(); haptic('light');
  state.currentCase = caseKey;
  state.busySpin = false;
  state.busyCase = false;

  showScreen('caseOpen');
  startIdleSpin(caseKey);
  $('spinResult').className = 'spin-result';
  updateBalance();

  if (caseKey === 'subcase') {
    stopSubcaseTimer();
    lockSpinBtn('Проверяем...');
    checkSubcaseStatus().then(() => {
      updateSubcaseButton();
      startSubcaseTimer();
    });
  } else {
    stopSubcaseTimer();
    updateSpinButton();
  }
}

function updateSpinButton() {
  const caseKey = state.currentCase;
  const count = state.inventory[caseKey] || 0;
  if (count > 0) unlockSpinBtn(`Открыть (${count})`);
  else unlockSpinBtn(`Купить за ${CASES[caseKey].price} ★`);
}

function updateSubcaseButton() {
  const btn = $('spinBtn');

  if (!state.subcaseSubscribed) {
    btn.disabled = false;
    btn.classList.remove('disabled');
    btn.textContent = 'Подписаться';
    return;
  }

  if (state.subcaseCanOpen) {
    btn.disabled = false;
    btn.classList.remove('disabled');
    btn.textContent = 'Открыть';
  } else {
    btn.disabled = true;
    btn.classList.add('disabled');
    const ms = state.subcaseNextAt - Date.now();
    btn.textContent = formatTimer(ms);
  }
}

function startSubcaseTimer() {
  stopSubcaseTimer();
  function frame() {
    if (state.currentCase !== 'subcase') return;
    if (!state.subcaseCanOpen && state.subcaseSubscribed) {
      const ms = state.subcaseNextAt - Date.now();
      if (ms <= 0) {
        state.subcaseCanOpen = true;
        updateSubcaseButton();
        return;
      }
      const btn = $('spinBtn');
      if (btn && btn.classList.contains('disabled')) {
        btn.textContent = formatTimer(ms);
      }
    }
    state.subcaseTimerRaf = requestAnimationFrame(frame);
  }
  state.subcaseTimerRaf = requestAnimationFrame(frame);
}

function stopSubcaseTimer() {
  if (state.subcaseTimerRaf) {
    cancelAnimationFrame(state.subcaseTimerRaf);
    state.subcaseTimerRaf = null;
  }
}

function mainCaseAction() {
  if (state.busyCase || state.busySpin) return;
  const caseKey = state.currentCase;

  if (caseKey === 'subcase') {
    if (!state.subcaseSubscribed) {
      if (tg) tg.openTelegramLink('https://t.me/EndlessBet_channel');
      else window.open('https://t.me/EndlessBet_channel', '_blank');
      setTimeout(async () => {
        await checkSubcaseStatus();
        updateSubcaseButton();
        startSubcaseTimer();
      }, 2000);
      return;
    }
    if (!state.subcaseCanOpen) return;
    spinSubcase();
    return;
  }

  const count = state.inventory[caseKey] || 0;
  if (count > 0) spinCase();
  else buyCase(caseKey);
}

/* ==== Покупка кейса ==== */
async function buyCase(caseKey) {
  if (state.busyCase) return;
  haptic('light');
  const c = CASES[caseKey];
  if (state.balance < c.price) return toastText('Недостаточно звёзд');

  lockSpinBtn('Подождите...');
  state.busyCase = true;

  const ok = await spendAPI(c.price);
  if (!ok) {
    state.busyCase = false;
    updateSpinButton();
    return;
  }

  await inventoryAdd(caseKey);
  state.busyCase = false;

  toastDelta(-c.price);
  updateSpinButton();
}

/* ==== Прокрутка кейса ==== */
async function spinCase() {
  if (state.busySpin) return;
  initAudio(); haptic('medium');
  state.busySpin = true;

  const caseKey = state.currentCase;
  const c = CASES[caseKey];
  const track = $('track');
  const winPrize = pickPrize(caseKey);

  stopIdleSpin();
  lockSpinBtn('Открываем...');

  const spent = await inventorySpend(caseKey);
  if (!spent) {
    state.busySpin = false;
    updateSpinButton();
    return;
  }

  track.innerHTML = '';
  for (let i = 0; i < TRACK_SIZE; i++) {
    let prize;
    if (i === STOP_INDEX) prize = winPrize;
    else if (Math.abs(i - STOP_INDEX) === 1) {
      const idx = c.prizes.findIndex(p => p.prize === winPrize);
      const neighborIdx = Math.max(0, Math.min(c.prizes.length - 1,
        idx + (Math.random() < 0.5 ? 1 : -1)));
      prize = c.prizes[neighborIdx].prize;
    } else {
      prize = c.prizes[Math.floor(Math.random() * c.prizes.length)].prize;
    }
    track.appendChild(makeSlot(prize, c));
  }

  void track.offsetWidth;

  const wrap = track.parentElement;
  const wrapW = wrap.clientWidth;
  const targetSlot = track.children[STOP_INDEX];
  const trackRect = track.getBoundingClientRect();
  const slotRect = targetSlot.getBoundingClientRect();
  const slotCenter = (slotRect.left - trackRect.left) + slotRect.width / 2;
  const targetX = wrapW / 2 - slotCenter;

  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  void track.offsetWidth;

  const duration = 5000;
  track.style.transition = `transform ${duration}ms cubic-bezier(0.12, 0.85, 0.18, 1)`;
  track.style.transform = `translateX(${targetX}px)`;

  const SLOT_STEP = 90;
  const startTime = performance.now();
  const wrapLeft = wrap.getBoundingClientRect().left;
  let lastSlotIndex = 0;

  function tick(now) {
    if (!state.busySpin) return;
    const elapsed = now - startTime;
    if (elapsed > duration) return;
    const currentLeft = track.getBoundingClientRect().left;
    const currentX = currentLeft - wrapLeft;
    const pointerPos = wrapW / 2 - currentX;
    const slotIndex = Math.floor(pointerPos / SLOT_STEP);
    if (slotIndex !== lastSlotIndex) {
      if (slotIndex > lastSlotIndex) popSound();
      lastSlotIndex = slotIndex;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  setTimeout(async () => {
    await finishSpin(winPrize, c, caseKey);
  }, duration + 80);
}

async function finishSpin(prize, c, caseKey) {
  await winAPI(prize);
  updateBalance();

  $('spinValue').innerHTML = fmt(prize) + ' ' + starIco();
  $('spinResult').className = 'spin-result show';

  haptic(prize >= c.price ? 'success' : 'error');
  toastDelta(prize);

  state.busySpin = false;
  updateSpinButton();

  setTimeout(() => {
    if (state.currentCase === caseKey) {
      $('spinResult').className = 'spin-result';
      startIdleSpin(caseKey);
    }
  }, 2000);
}

/* ==== Подписочный кейс ==== */

async function finishSubcase(prize, c) {
  await winAPI(prize);
  updateBalance();

  $('spinValue').innerHTML = fmt(prize) + ' ' + starIco();

/* ==================== ПРОМОКОД ==================== */
async function applyPromo() {
  haptic('light');
  const code = $('promoInput').value.trim().toUpperCase();
  if (!code) return toastText('Введи код');

  const uid = getUserId();
  if (!uid) return toastText('Открой из Telegram');

  try {
    const d = await apiCall('/api/promo/activate', { user_id: uid, code });
    state.balance = d.balance;
    state.withdrawable = d.withdrawable;
    updateBalance(); updateProfileBalance();
    $('promoInput').value = '';
    haptic('success');
    toastDelta(d.stars);
  } catch (e) {
    toastText(e.message);
  }
}

/* ==================== ВЫВОД ==================== */
async function withdrawOpen() {
  haptic('light');
  const amountStr = prompt('Сколько вывести? (мин. 100 ★)');
  if (!amountStr) return;
  const amount = parseInt(amountStr, 10);
  if (!amount || amount < 100) return toastText('Минимум 100 ★');

  const uid = getUserId();
  if (!uid) return toastText('Открой из Telegram');

  try {
    await apiCall('/api/withdraw', { user_id: uid, amount });
    toastText('Заявка отправлена');
    await syncBalance();
  } catch (e) {
    toastText(e.message);
  }
}

/* ==================== ПОПОЛНЕНИЕ ==================== */
const TOPUP_PACKAGES = [
  { key: 'topup_50',   stars: 50 },
  { key: 'topup_100',  stars: 100 },
  { key: 'topup_500',  stars: 500 },
  { key: 'topup_1000', stars: 1000 },
];

function openTopupSheet() {
  haptic('light');
  const box = $('topupPacks');
  box.innerHTML = '';
  TOPUP_PACKAGES.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'pack-btn';
    btn.innerHTML = `<span class="left">${starIco()}<span>${p.stars}</span></span><span class="right">${p.stars} ★</span>`;
    btn.onclick = () => buyTopup(p.stars);
    box.appendChild(btn);
  });
  $('customTopup').value = '';
  $('topupModal').style.display = 'flex';
}

function closeTopupSheet() {
  $('topupModal').style.display = 'none';
}

function buyCustomTopup() {
  const v = parseInt($('customTopup').value, 10);
  if (!v || v < 1) return toastText('Введи сумму');
  if (v > 100000) return toastText('Максимум 100 000');
  buyTopup(v);
}

async function buyTopup(stars) {
  haptic('light');
  const uid = getUserId();
  if (!uid) return toastText('Открой из Telegram');

  closeTopupSheet();

  try {
    const d = await apiCall('/api/create-invoice', { user_id: uid, stars: stars });
    if (!d.invoice_link) return toastText('Ошибка создания счёта');

    tg.openInvoice(d.invoice_link, async (status) => {
      if (status === 'paid') await syncBalance();
      else if (status === 'cancelled') toastText('Отменено');
    });
  } catch (e) {
    toastText(e.message);
  }
}
