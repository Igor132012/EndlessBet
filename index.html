<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EndlessBet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#0a0a0a; color:#fff; user-select:none;
  }

  /* ===== Экраны ===== */
  .screen {
    position:fixed; inset:0; display:flex; flex-direction:column;
    background:#0a0a0a;
    transition:opacity .25s;
  }
  .screen.hidden { opacity:0; pointer-events:none; }

  /* ===== Главное меню ===== */
  #menu { align-items:center; justify-content:center; padding:28px; text-align:center; }

  .brand {
    font-size:13px; color:#555; letter-spacing:4px; text-transform:uppercase;
    margin-bottom:40px;
  }

  .balance-block { margin-bottom:52px; }
  .balance-label { font-size:11px; color:#555; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; }
  .balance-value {
    font-size:52px; font-weight:200; letter-spacing:-1px;
    color:#fff; font-variant-numeric:tabular-nums;
  }
  .balance-value span { color:#555; font-size:24px; margin-left:6px; }

  .modes { display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px; }
  .mode-btn {
    background:transparent; border:1px solid #1e1e1e;
    border-radius:14px; padding:20px 24px; color:#fff; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    transition:border-color .2s, background .2s; font-family:inherit;
    font-size:15px; letter-spacing:1px;
  }
  .mode-btn:active { background:#141414; border-color:#2a2a2a; }
  .mode-btn .label { font-weight:500; }
  .mode-btn .sub { color:#555; font-size:12px; margin-top:2px; letter-spacing:0; }
  .mode-btn .arrow { color:#333; font-size:18px; }

  .reset-btn {
    margin-top:36px; background:transparent; border:none;
    color:#333; font-size:12px; letter-spacing:1px; cursor:pointer;
    font-family:inherit; padding:8px 16px;
  }
  .reset-btn:active { color:#555; }

  /* ===== Верхняя панель ===== */
  .topbar {
    padding:18px 22px; display:flex; justify-content:space-between; align-items:center;
  }
  .back-btn {
    background:transparent; border:none; color:#666;
    font-size:22px; cursor:pointer; padding:6px 10px;
    font-family:inherit; line-height:1;
  }
  .back-btn:active { color:#aaa; }
  .topbar-balance {
    color:#888; font-size:14px; font-variant-numeric:tabular-nums;
  }
  .topbar-balance span { color:#444; font-size:11px; margin-left:4px; }

  /* ===== КРАШ ===== */
  .crash-stage {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; position:relative;
  }
  .crash-x {
    font-size:112px; font-weight:100; letter-spacing:-4px;
    color:#fff; font-variant-numeric:tabular-nums;
    transition:color .2s;
    line-height:1;
  }
  .crash-x.crashed { color:#ff3b3b; }
  .crash-caption {
    margin-top:20px; font-size:12px; color:#444; letter-spacing:2px;
    text-transform:uppercase;
  }

  .crash-controls { padding:0 22px 30px; }
  .crash-info {
    text-align:center; font-size:13px; color:#555;
    margin-bottom:14px; height:18px; letter-spacing:.5px;
  }
  .crash-info.active { color:#5cd65c; }

  .bet-row {
    display:flex; align-items:center;
    border:1px solid #1e1e1e; border-radius:14px;
    padding:0 18px; margin-bottom:10px;
    transition:border-color .2s;
  }
  .bet-row:focus-within { border-color:#333; }
  #betInput {
    flex:1; background:none; border:none; color:#fff;
    font-size:20px; font-weight:400; padding:18px 0; outline:none;
    width:100%; font-family:inherit; font-variant-numeric:tabular-nums;
  }
  #betInput::placeholder { color:#333; }
  .bet-row .unit { color:#444; font-size:14px; }

  .quick-row { display:flex; gap:6px; margin-bottom:10px; }
  .quick-btn {
    flex:1; background:transparent; border:1px solid #1a1a1a;
    color:#666; padding:10px; border-radius:10px; font-size:12px;
    cursor:pointer; transition:all .15s; font-family:inherit;
    font-variant-numeric:tabular-nums;
  }
  .quick-btn:active { border-color:#333; color:#aaa; }

  .main-btn {
    width:100%; background:transparent; border:1px solid #2a2a2a;
    border-radius:14px; padding:20px; color:#fff;
    font-size:14px; font-weight:500; letter-spacing:3px;
    cursor:pointer; transition:all .2s; font-family:inherit;
    text-transform:uppercase;
  }
  .main-btn:active { background:#141414; }
  .main-btn.cashout { color:#5cd65c; border-color:#2a4a2a; }
  .main-btn:disabled { color:#2a2a2a; border-color:#151515; cursor:not-allowed; }

  /* ===== КЕЙСЫ ===== */
  .cases-list {
    flex:1; padding:0 22px; display:flex; flex-direction:column;
    justify-content:center; gap:10px;
  }
  .case-item {
    background:transparent; border:1px solid #1e1e1e;
    border-radius:14px; padding:20px 24px; color:#fff;
    cursor:pointer; display:flex; justify-content:space-between;
    align-items:center; transition:border-color .2s; font-family:inherit;
    text-align:left;
  }
  .case-item:active { border-color:#333; }
  .case-item .info .name { font-size:15px; letter-spacing:1px; font-weight:500; }
  .case-item .info .range { color:#555; font-size:12px; margin-top:4px; }
  .case-item .price {
    font-size:15px; color:#888; font-variant-numeric:tabular-nums;
    letter-spacing:1px;
  }
  .case-item .price span { color:#444; font-size:11px; margin-left:3px; }

  /* ===== РУЛЕТКА ===== */
  .roulette-stage {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }

  .roulette {
    position:relative; width:100%; height:110px;
    overflow:hidden;
  }
  .roulette::before, .roulette::after {
    content:""; position:absolute; top:0; bottom:0; width:80px; z-index:4;
    pointer-events:none;
  }
  .roulette::before { left:0; background:linear-gradient(to right, #0a0a0a 10%, transparent); }
  .roulette::after { right:0; background:linear-gradient(to left, #0a0a0a 10%, transparent); }

  .track {
    position:absolute; top:0; left:0; height:100%;
    display:flex; align-items:center;
    will-change:transform;
  }

  .slot {
    width:80px; height:90px; margin:0 5px; flex-shrink:0;
    border:1px solid #1a1a1a; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:400; color:#666;
    font-variant-numeric:tabular-nums;
    transition:border-color .3s, color .3s;
  }
  .slot.rare    { color:#888; border-color:#2a2a2a; }
  .slot.epic    { color:#bbb; border-color:#3a3a3a; }
  .slot.legend  { color:#fff; border-color:#555; }

  .pointer {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:2px; height:120px; background:#fff; z-index:5;
    border-radius:1px;
    box-shadow:0 0 12px rgba(255,255,255,.5);
  }

  .spin-result {
    text-align:center; margin-top:36px;
    opacity:0; transition:opacity .3s;
  }
  .spin-result.show { opacity:1; }
  .spin-result .label {
    font-size:11px; color:#555; letter-spacing:2px; text-transform:uppercase;
    margin-bottom:8px;
  }
  .spin-result .val {
    font-size:44px; font-weight:200; letter-spacing:-1px;
    color:#fff; font-variant-numeric:tabular-nums;
  }
  .spin-result .val span { color:#555; font-size:20px; margin-left:6px; }

  .spin-controls { padding:0 22px 30px; }

  /* ===== Тост ===== */
  #toast {
    position:fixed; top:60px; left:50%;
    transform:translateX(-50%) translateY(-40px);
    background:#141414; color:#ccc;
    padding:12px 22px; border-radius:100px;
    font-size:13px; z-index:100;
    border:1px solid #222;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s;
    pointer-events:none; white-space:nowrap; opacity:0;
    letter-spacing:.5px;
  }
  #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>

<!-- ============ ГЛАВНОЕ МЕНЮ ============ -->
<div class="screen" id="menu">
  <div class="brand">Endless</div>

  <div class="balance-block">
    <div class="balance-label">Баланс</div>
    <div class="balance-value" id="menuBalance">1000<span>⭐</span></div>
  </div>

  <div class="modes">
    <button class="mode-btn" onclick="openMode('crash')">
      <div>
        <div class="label">Краш</div>
        <div class="sub">Успей забрать</div>
      </div>
      <div class="arrow">→</div>
    </button>
    <button class="mode-btn" onclick="openMode('cases')">
      <div>
        <div class="label">Кейсы</div>
        <div class="sub">Испытай удачу</div>
      </div>
      <div class="arrow">→</div>
    </button>
  </div>

  <button class="reset-btn" onclick="resetBalance()">сбросить баланс</button>
</div>

<!-- ============ КРАШ ============ -->
<div class="screen hidden" id="crash">
  <div class="topbar">
    <button class="back-btn" onclick="backToMenu()">←</button>
    <div class="topbar-balance" id="crashBalance">1000<span>⭐</span></div>
  </div>

  <div class="crash-stage">
    <div class="crash-x" id="multiplier">1.00x</div>
    <div class="crash-caption" id="crashCaption">нажми старт</div>
  </div>

  <div class="crash-controls">
    <div class="crash-info" id="crashInfo"></div>
    <div class="bet-row">
      <input type="number" id="betInput" placeholder="0" value="50" min="1">
      <span class="unit">⭐</span>
    </div>
    <div class="quick-row" id="quickRow">
      <button class="quick-btn" onclick="setBet(10)">10</button>
      <button class="quick-btn" onclick="setBet(50)">50</button>
      <button class="quick-btn" onclick="setBet(100)">100</button>
      <button class="quick-btn" onclick="setBet(500)">500</button>
      <button class="quick-btn" onclick="setBet('all')">max</button>
    </div>
    <button class="main-btn" id="actionBtn" onclick="handleCrashAction()">Старт</button>
  </div>
</div>

<!-- ============ ВЫБОР КЕЙСА ============ -->
<div class="screen hidden" id="cases">
  <div class="topbar">
    <button class="back-btn" onclick="backToMenu()">←</button>
    <div class="topbar-balance" id="casesBalance">1000<span>⭐</span></div>
  </div>

  <div class="cases-list">
    <button class="case-item" onclick="buyCase('case10')">
      <div class="info">
        <div class="name">Обычный</div>
        <div class="range">1 — 1 000</div>
      </div>
      <div class="price">10<span>⭐</span></div>
    </button>

    <button class="case-item" onclick="buyCase('case50')">
      <div class="info">
        <div class="name">Редкий</div>
        <div class="range">5 — 2 000</div>
      </div>
      <div class="price">50<span>⭐</span></div>
    </button>

    <button class="case-item" onclick="buyCase('case100')">
      <div class="info">
        <div class="name">Легендарный</div>
        <div class="range">10 — 5 000</div>
      </div>
      <div class="price">100<span>⭐</span></div>
    </button>
  </div>
</div>

<!-- ============ ОТКРЫТИЕ ============ -->
<div class="screen hidden" id="caseOpen">
  <div class="topbar">
    <button class="back-btn" onclick="closeCase()">←</button>
    <div class="topbar-balance" id="openBalance">1000<span>⭐</span></div>
  </div>

  <div class="roulette-stage">
    <div class="roulette">
      <div class="track" id="track"></div>
      <div class="pointer"></div>
    </div>

    <div class="spin-result" id="spinResult">
      <div class="label">Выпало</div>
      <div class="val" id="spinValue">0<span>⭐</span></div>
    </div>
  </div>

  <div class="spin-controls">
    <button class="main-btn" id="spinBtn" onclick="spin()">Открыть</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ==================== TELEGRAM ==================== */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ==================== СОСТОЯНИЕ ==================== */
const state = {
  balance: 1000,
  crashPhase: 'idle',
  crashMultiplier: 1.0,
  crashAt: 2.0,
  crashStart: 0,
  crashBet: 0,
  crashRaf: null,
  spinning: false,
  currentCase: null,
};

/* ==================== DOM ==================== */
const $ = id => document.getElementById(id);

/* ==================== ЗВУК ==================== */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function initAudio() { if (!actx) actx = new AudioCtx(); if (actx.state === 'suspended') actx.resume(); }
function tone(freq, dur, type='sine', vol=0.06) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}

/* ==================== HAPTIC ==================== */
function haptic(type) {
  if (!tg?.HapticFeedback) return;
  if (type === 'light')   tg.HapticFeedback.impactOccurred('light');
  if (type === 'medium')  tg.HapticFeedback.impactOccurred('medium');
  if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
  if (type === 'error')   tg.HapticFeedback.notificationOccurred('error');
}

/* ==================== UI ==================== */
function fmt(n) { return Math.floor(n).toLocaleString('ru-RU'); }
function updateBalance() {
  const b = fmt(state.balance);
  $('menuBalance').innerHTML = b + '<span>⭐</span>';
  $('crashBalance').innerHTML = b + '<span>⭐</span>';
  $('casesBalance').innerHTML = b + '<span>⭐</span>';
  $('openBalance').innerHTML = b + '<span>⭐</span>';
}
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = '', 1800);
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  $(id).classList.remove('hidden');
}

/* ==================== НАВИГАЦИЯ ==================== */
function openMode(mode) {
  initAudio(); haptic('light');
  if (mode === 'crash') {
    showScreen('crash');
    $('betInput').value = Math.min(50, Math.max(1, Math.floor(state.balance)));
  } else {
    showScreen('cases');
  }
  updateBalance();
}
function backToMenu() {
  haptic('light');
  if (state.crashPhase === 'flying') cashoutCrash();
  cancelAnimationFrame(state.crashRaf);
  state.crashPhase = 'idle';
  showScreen('menu');
  updateBalance();
}
function closeCase() {
  haptic('light');
  if (state.spinning) return;
  showScreen('cases');
  updateBalance();
}
function resetBalance() {
  haptic('light');
  state.balance = 1000;
  updateBalance();
  toast('Баланс восстановлен');
}

/* ==================== КРАШ ==================== */
function generateCrashPoint() {
  const r = Math.random();
  if (r < 0.03) return 1.0 + Math.random() * 0.2;
  const raw = 0.92 / (1 - r);
  return Math.max(1.01, Math.floor(raw * 100) / 100);
}

function startCrashRound() {
  const bet = Math.floor(Number($('betInput').value) || 0);
  if (bet <= 0) return toast('Введи ставку');
  if (bet > state.balance) return toast('Недостаточно звёзд');

  state.crashBet = bet;
  state.balance -= bet;
  updateBalance();

  state.crashPhase = 'flying';
  state.crashMultiplier = 1.0;
  state.crashAt = generateCrashPoint();
  state.crashStart = performance.now();

  $('quickRow').style.display = 'none';
  $('betInput').parentElement.style.display = 'none';
  $('actionBtn').textContent = 'Забрать';
  $('actionBtn').className = 'main-btn cashout';
  $('actionBtn').disabled = false;
  $('crashCaption').textContent = `ставка ${fmt(bet)} ⭐`;
  $('multiplier').className = 'crash-x';
  $('multiplier').style.color = '#fff';

  initAudio(); tone(220, 0.08, 'sine');
  haptic('medium');
  state.crashRaf = requestAnimationFrame(crashLoop);
}

function crashLoop(now) {
  if (state.crashPhase !== 'flying') return;
  const elapsed = (now - state.crashStart) / 1000;
  const m = Math.pow(1.0718, elapsed * 1.6);
  state.crashMultiplier = m;

  if (m >= state.crashAt) {
    state.crashMultiplier = state.crashAt;
    return crashBoom();
  }

  $('multiplier').textContent = m.toFixed(2) + 'x';

  // Плавное обесцвечивание: от белого к красному через серый
  const t = Math.min(m / 10, 1);
  const r = Math.floor(255 * (0.5 + t * 0.5));
  const gb = Math.floor(255 * (1 - t * 0.85));
  $('multiplier').style.color = `rgb(${r},${gb},${gb})`;

  const potential = Math.floor(state.crashBet * m);
  $('crashInfo').textContent = `${fmt(potential)} ⭐`;
  $('crashInfo').className = 'crash-info active';

  state.crashRaf = requestAnimationFrame(crashLoop);
}

function crashBoom() {
  state.crashPhase = 'crashed';
  cancelAnimationFrame(state.crashRaf);
  tone(200, 0.5, 'sawtooth', 0.1);
  haptic('error');

  const el = $('multiplier');
  el.className = 'crash-x crashed';
  el.textContent = state.crashAt.toFixed(2) + 'x';
  $('crashCaption').textContent = `крах · ставка сгорела`;
  $('crashInfo').textContent = '';
  $('crashInfo').className = 'crash-info';

  setTimeout(() => endCrashRound(), 1600);
}

function cashoutCrash() {
  if (state.crashPhase !== 'flying') return;
  state.crashPhase = 'cashed';
  cancelAnimationFrame(state.crashRaf);
  tone(660, 0.1); setTimeout(()=>tone(880, 0.15), 80);
  haptic('success');

  const win = Math.floor(state.crashBet * state.crashMultiplier);
  state.balance += win;
  updateBalance();

  $('multiplier').style.color = '#5cd65c';
  $('crashCaption').textContent = `забрано · +${fmt(win)} ⭐`;
  $('crashInfo').textContent = '';
  $('crashInfo').className = 'crash-info';
  toast(`+${fmt(win)} ⭐`);

  setTimeout(() => endCrashRound(), 1200);
}

function endCrashRound() {
  state.crashPhase = 'idle';
  $('multiplier').textContent = '1.00x';
  $('multiplier').className = 'crash-x';
  $('multiplier').style.color = '#fff';
  $('crashCaption').textContent = 'нажми старт';
  $('quickRow').style.display = 'flex';
  $('betInput').parentElement.style.display = 'flex';
  $('actionBtn').textContent = 'Старт';
  $('actionBtn').className = 'main-btn';
  $('crashInfo').textContent = '';
  $('crashInfo').className = 'crash-info';
}

function handleCrashAction() {
  initAudio();
  if (state.crashPhase === 'flying') cashoutCrash();
  else if (state.crashPhase === 'idle') startCrashRound();
}
function setBet(v) {
  haptic('light');
  if (v === 'all') $('betInput').value = Math.max(1, Math.floor(state.balance));
  else $('betInput').value = v;
}

/* ==================== КЕЙСЫ ==================== */
const CASES = {
  case10: {
    price: 10, min: 1, max: 1000,
    prizes: [
      { prize: 1,    weight: 3500 },
      { prize: 2,    weight: 2500 },
      { prize: 5,    weight: 1500 },
      { prize: 10,   weight: 1000 },
      { prize: 25,   weight: 700 },
      { prize: 50,   weight: 500 },
      { prize: 100,  weight: 200 },
      { prize: 250,  weight: 70 },
      { prize: 500,  weight: 25 },
      { prize: 1000, weight: 5 },
    ]
  },
  case50: {
    price: 50, min: 5, max: 2000,
    prizes: [
      { prize: 5,    weight: 3500 },
      { prize: 15,   weight: 2500 },
      { prize: 30,   weight: 1500 },
      { prize: 60,   weight: 1000 },
      { prize: 100,  weight: 700 },
      { prize: 200,  weight: 500 },
      { prize: 400,  weight: 200 },
      { prize: 700,  weight: 70 },
      { prize: 1200, weight: 25 },
      { prize: 2000, weight: 5 },
    ]
  },
  case100: {
    price: 100, min: 10, max: 5000,
    prizes: [
      { prize: 10,   weight: 3500 },
      { prize: 30,   weight: 2500 },
      { prize: 70,   weight: 1500 },
      { prize: 150,  weight: 1000 },
      { prize: 300,  weight: 700 },
      { prize: 600,  weight: 500 },
      { prize: 1000, weight: 200 },
      { prize: 2000, weight: 70 },
      { prize: 3500, weight: 25 },
      { prize: 5000, weight: 5 },
    ]
  }
};

function pickPrize(caseKey) {
  const c = CASES[caseKey];
  const total = c.prizes.reduce((s, p) => s + p.weight, 0);
  let r = Math.random() * total;
  for (const p of c.prizes) {
    r -= p.weight;
    if (r <= 0) return p.prize;
  }
  return c.prizes[0].prize;
}

function tierOf(prize, c) {
  const ratio = (prize - c.min) / (c.max - c.min);
  if (ratio >= 0.85) return 'legend';
  if (ratio >= 0.6)  return 'epic';
  if (ratio >= 0.35) return 'rare';
  return '';
}

function makeSlot(prize, c) {
  const el = document.createElement('div');
  const tier = tierOf(prize, c);
  el.className = 'slot' + (tier ? ' ' + tier : '');
  el.textContent = prize;
  return el;
}

/* ============================================================
   ВАЖНО: синхронизация визуала и результата
   ————————————————————————————————————————————————
   1. Сначала честно выбираем приз через pickPrize().
   2. Строим трек из N слотов так, чтобы в позиции STOP_INDEX
      лежал именно этот приз. Остальные слоты — случайные.
   3. Останавливаем ленту так, чтобы центр слота STOP_INDEX
      совпал с указателем. Ширина слота берётся из реального
      DOM (getBoundingClientRect), а не из магических чисел.
   ============================================================ */
const TRACK_SIZE  = 60;   // всего слотов в ленте
const STOP_INDEX  = 50;   // на каком слоте остановимся (не последний — для плавности)

function buyCase(caseKey) {
  initAudio(); haptic('light');
  const c = CASES[caseKey];
  if (state.balance < c.price) return toast('Недостаточно звёзд');

  state.currentCase = caseKey;
  state.balance -= c.price;
  updateBalance();

  $('spinResult').className = 'spin-result';
  $('spinBtn').textContent = 'Открыть';
  $('spinBtn').disabled = false;
  $('spinBtn').onclick = spin;

  // Пустой трек — заполним при спине
  $('track').innerHTML = '';
  $('track').style.transition = 'none';
  $('track').style.transform = 'translateX(0)';

  showScreen('caseOpen');
  toast(`Кейс куплен · −${c.price} ⭐`);
}

function spin() {
  if (state.spinning) return;
  initAudio(); haptic('medium');
  state.spinning = true;
  $('spinBtn').disabled = true;
  $('spinBtn').textContent = '...';

  const caseKey = state.currentCase;
  const c = CASES[caseKey];
  const track = $('track');

  /* --- 1. ЧЕСТНО ВЫБИРАЕМ ПРИЗ --- */
  const winPrize = pickPrize(caseKey);

  /* --- 2. СТРОИМ ТРЕК --- */
  track.innerHTML = '';
  for (let i = 0; i < TRACK_SIZE; i++) {
    let prize;
    if (i === STOP_INDEX) {
      prize = winPrize;                           // сюда встанет указатель
    } else if (Math.abs(i - STOP_INDEX) === 1) {
      // Соседи — соседний по редкости приз (драма «чуть не докрутилось»)
      const idx = c.prizes.findIndex(p => p.prize === winPrize);
      const neighborIdx = Math.max(0, Math.min(c.prizes.length - 1,
        idx + (Math.random() < 0.5 ? 1 : -1)));
      prize = c.prizes[neighborIdx].prize;
    } else {
      prize = c.prizes[Math.floor(Math.random() * c.prizes.length)].prize;
    }
    track.appendChild(makeSlot(prize, c));
  }

  /* --- 3. ВЫЧИСЛЯЕМ ТОЧНУЮ ПОЗИЦИЮ ОСТАНОВКИ --- */
  // Форсируем reflow, чтобы слоты получили размеры
  void track.offsetWidth;

  const wrap = track.parentElement;
  const wrapW = wrap.clientWidth;

  // Реальные размеры и позиции слотов
  const slots = track.children;
  const targetSlot = slots[STOP_INDEX];
  const trackRect = track.getBoundingClientRect();
  const slotRect = targetSlot.getBoundingClientRect();

  // Центр слота относительно начала трека
  const slotCenter = (slotRect.left - trackRect.left) + slotRect.width / 2;

  // Нам нужно, чтобы slotCenter оказался в wrapW/2
  // Текущий transform = 0, значит смещение = wrapW/2 - slotCenter
  const targetX = wrapW / 2 - slotCenter;

  // Сброс перед анимацией
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  void track.offsetWidth;

  /* --- 4. АНИМАЦИЯ --- */
  const duration = 5000;
  track.style.transition = `transform ${duration}ms cubic-bezier(0.12, 0.85, 0.18, 1)`;
  track.style.transform = `translateX(${targetX}px)`;

  // Тикающий звук замедляется к концу
  let elapsed = 0;
  const tickSchedule = [];
  while (elapsed < duration - 200) {
    const interval = 40 + elapsed * 0.08; // ускоряемся-замедляемся
    elapsed += interval;
    tickSchedule.push(elapsed);
  }
  tickSchedule.forEach(t => {
    setTimeout(() => tone(1200, 0.015, 'square', 0.02), t);
  });

  /* --- 5. ФИНАЛ --- */
  setTimeout(() => {
    state.spinning = false;
    finishSpin(winPrize, c);
  }, duration + 80);
}

function finishSpin(prize, c) {
  state.balance += prize;
  updateBalance();

  $('spinValue').innerHTML = fmt(prize) + '<span>⭐</span>';
  $('spinResult').className = 'spin-result show';

  const isProfit = prize >= c.price;
  if (isProfit) {
    haptic('success');
    tone(660, 0.1); setTimeout(()=>tone(880, 0.12), 80); setTimeout(()=>tone(1320, 0.15), 160);
    toast(`+${fmt(prize)} ⭐`);
  } else {
    haptic('error');
    tone(300, 0.15, 'sine', 0.05);
    toast(`выпало ${fmt(prize)} ⭐`);
  }

  $('spinBtn').disabled = false;
  $('spinBtn').textContent = 'Ещё раз';
  $('spinBtn').onclick = () => {
    if (state.balance < c.price) return toast('Недостаточно звёзд');
    buyCase(state.currentCase);
    setTimeout(spin, 250);
  };
}

/* ==================== INIT ==================== */
updateBalance();
</script>
</body>
</html>
